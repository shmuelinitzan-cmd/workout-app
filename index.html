<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אימונים</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אימונים">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b0d;--card:#1a1a20;--card2:#2a2a33;--text:#fff;--dim:#b4b4c0;--acc:#4ade80;--accText:#06210f;--danger:#ff6b6b;--warn:#fbbf24}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.35;overflow-x:hidden;touch-action:manipulation}
#app{min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 16px);max-width:640px;margin:0 auto}
#app.noNav{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:30px;margin:8px 0 16px;overflow-wrap:anywhere}
h2{font-size:24px;margin:0 0 8px;overflow-wrap:anywhere}
p{margin:0 0 12px}
.dim{color:var(--dim)}
.small{font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;min-width:0}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.between{justify-content:space-between}
button,.btn{font:inherit;font-size:20px;font-weight:600;color:var(--text);background:var(--card2);border:0;border-radius:14px;min-height:56px;padding:0 18px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.4}
.pri{background:var(--acc);color:var(--accText)}
.dng{background:#3a1a1c;color:var(--danger)}
.big{min-height:72px;font-size:26px;width:100%}
.sq{width:56px;padding:0;flex:none}
.play{width:64px;height:64px;border-radius:50%;padding:0;font-size:26px;flex:none;background:var(--acc);color:var(--accText)}
input[type=text],input[type=number],input:not([type]){font:inherit;font-size:20px;color:var(--text);background:#0f0f13;border:2px solid #3a3a46;border-radius:12px;min-height:56px;padding:0 14px;width:100%}
input:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:15px;color:var(--dim);margin-bottom:4px}
.field{flex:1;min-width:0}
.chk{display:flex;gap:12px;align-items:center;font-size:20px;color:var(--text);min-height:56px;margin:0}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#121216;border-top:1px solid #2a2a33;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav button{flex:1;background:none;border-radius:0;font-size:17px;color:var(--dim);min-height:64px;padding:0 4px}
nav button.on{color:var(--acc)}
.prog{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:8px 0 16px}
.prog i{display:block;height:100%;background:var(--acc)}
.wname{font-size:32px;font-weight:700;margin:8px 0 4px;overflow-wrap:anywhere}
.wgt{font-size:30px;color:var(--acc);font-weight:700;margin-bottom:16px}
.reps{color:var(--text)}
.err{background:#3a1a1c;color:var(--danger);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:17px}
.timer{font-size:72px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;padding:16px 0}
.timer.run{color:var(--warn)}
.timer.idle{color:var(--dim)}
.setc{font-size:26px;font-weight:600}
.tag{display:inline-block;background:var(--card2);border-radius:8px;padding:2px 10px;font-size:15px;color:var(--dim)}
.ov{position:fixed;inset:0;background:var(--acc);color:var(--accText);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:10;font-size:40px;font-weight:800;text-align:center;padding:24px}
.ov button{background:var(--accText);color:var(--acc);width:80%}
.sep{height:1px;background:#2a2a33;margin:12px 0}
.warnbox{background:#2b2410;color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:16px}
.item{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="ov"></div>
<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var KEY='workout-app.v1';
var NAMES=['עליון A','תחתון A','עליון B','תחתון B'];
var storageOK=true;
var S;

function blank(){
  return {plan:NAMES.map(function(n){return {name:n,exercises:[]};}),log:[],session:null};
}
function num(v,def){
  var n=parseFloat(String(v).replace(',','.'));
  return isFinite(n)?n:def;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

// Whole number >= 1, or null when missing/invalid (old data has no rep fields).
function cleanRep(v){
  if(v===null||v===undefined||v==='')return null;
  var n=Math.round(num(v,0));
  return n>=1?n:null;
}
function cleanEx(e){
  return {id:String(e.id||uid()),name:String(e.name||'').slice(0,80),
    weight:Math.max(0,num(e.weight,0)),sets:Math.max(1,Math.round(num(e.sets,3))),rest:Math.max(0,Math.round(num(e.rest,90))),
    repMin:cleanRep(e.repMin),repMax:cleanRep(e.repMax)};
}
function cleanLog(r){
  return {ts:num(r.ts,Date.now()),workout:String(r.workout||''),
    items:(Array.isArray(r.items)?r.items:[]).map(function(i){
      return {name:String(i.name||'').slice(0,80),weight:Math.max(0,num(i.weight,0)),sets:Math.max(0,Math.round(num(i.sets,0))),
        repMin:cleanRep(i.repMin),repMax:cleanRep(i.repMax)};
    })};
}
function repsText(o){
  var a=o.repMin,b=o.repMax;
  if(!a&&!b)return '';
  if(a&&b&&a!==b)return a+'-'+b+' חזרות';
  return (a||b)+' חזרות';
}
// Returns a clean {plan,log} or null when the shape is wrong.
function normalize(d){
  if(!d||!Array.isArray(d.plan)||d.plan.length!==4||!Array.isArray(d.log))return null;
  var out=blank();
  for(var i=0;i<4;i++){
    var w=d.plan[i];
    if(!w||!Array.isArray(w.exercises))return null;
    out.plan[i].exercises=w.exercises.map(cleanEx);
  }
  out.log=d.log.map(cleanLog);
  return out;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r),n=normalize(d);
      if(n){
        var s=d.session;
        if(s&&typeof s.w==='number'&&s.w>=0&&s.w<4&&s.done&&typeof s.done==='object'){
          n.session={w:s.w,i:Math.max(0,s.i|0),done:s.done,tEnd:s.tEnd||null,tPause:s.tPause||null,tTotal:s.tTotal||0,start:s.start||Date.now()};
        }
        return n;
      }
    }
  }catch(e){storageOK=false;}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function fmtW(w){return String(Math.round(w*100)/100);}
function fmtDate(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+
    d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}
function fmtT(sec){
  sec=Math.max(0,Math.ceil(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function total(){return S.plan.reduce(function(a,w){return a+w.exercises.length;},0);}
function $(id){return document.getElementById(id);}

/* ---------- audio (iOS needs an unlock inside a user gesture) ---------- */
var actx=null;
function unlockAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state!=='running')actx.resume();
    var b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();
    src.buffer=b;src.connect(actx.destination);src.start(0);
  }catch(e){}
}
['touchend','pointerdown','click'].forEach(function(ev){document.addEventListener(ev,unlockAudio,{passive:true});});

function beeps(){
  try{
    if(!actx)unlockAudio();
    if(!actx)return;
    if(actx.state!=='running')actx.resume();
    var t=actx.currentTime+0.05;
    [880,880,1175].forEach(function(f,k){
      var o=actx.createOscillator(),g=actx.createGain(),st=t+k*0.32;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.6,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.24);
      o.connect(g);g.connect(actx.destination);
      o.start(st);o.stop(st+0.26);
    });
  }catch(e){}
}

/* ---------- wake lock ---------- */
var wl=null;
function wakeOn(){
  try{
    if(!('wakeLock' in navigator)||wl)return;
    navigator.wakeLock.request('screen').then(function(l){
      wl=l;l.addEventListener('release',function(){wl=null;});
    }).catch(function(){});
  }catch(e){}
}
function wakeOff(){
  try{if(wl){wl.release();wl=null;}}catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.session&&ui.screen==='workout')wakeOn();
});

/* ---------- ui state ---------- */
var ui={screen:'home',wi:0,editId:null,logIdx:-1,alarm:false,summary:null};

function curWorkout(){return S.plan[S.session?S.session.w:ui.wi];}

/* ---------- views ---------- */
function viewHome(){
  var h='<h1>אימונים</h1>';
  if(!storageOK)h+='<div class="warnbox">אחסון הדפדפן לא זמין — הנתונים לא יישמרו.</div>';
  if(S.session){
    h+='<div class="card"><h2>אימון בתהליך</h2><p class="dim">'+esc(S.plan[S.session.w].name)+'</p>'+
      '<button class="pri big" data-act="resume">המשך אימון</button></div>';
  }
  if(total()===0){
    h+='<div class="card"><h2>התחלה</h2><p class="dim">התוכנית ריקה. הוסף תרגילים לאימונים.</p>'+
      '<button class="pri big" data-act="goplan">הוסף תרגיל</button></div>';
  }
  S.plan.forEach(function(w,i){
    h+='<div class="card"><div class="row between"><div class="grow"><h2>'+esc(w.name)+'</h2>'+
      '<div class="dim">'+w.exercises.length+' תרגילים</div></div>'+
      '<button class="play" aria-label="התחל '+esc(w.name)+'" data-act="start" data-i="'+i+'">&#9654;</button></div></div>';
  });
  return h;
}

function viewWorkout(){
  var s=S.session,w=S.plan[s.w],n=w.exercises.length;
  if(!n)return '<p>אין תרגילים.</p>';
  var ex=w.exercises[s.i],done=s.done[ex.id]||0,complete=done>=ex.sets;
  var running=!!s.tEnd,paused=!!s.tPause;
  var h='<div class="row between"><div class="small dim">תרגיל '+(s.i+1)+' מתוך '+n+'</div>'+
    '<button class="sq dng" data-act="exit" aria-label="יציאה">&#10005;</button></div>'+
    '<div class="prog"><i style="width:'+Math.round((s.i+1)/n*100)+'%"></i></div>'+
    '<div class="wname">'+esc(ex.name)+'</div>'+
    '<div class="wgt">'+fmtW(ex.weight)+' ק״ג'+(repsText(ex)?' <span class="reps">· '+repsText(ex)+'</span>':'')+'</div>'+
    '<div class="card"><div class="row between"><div class="setc">'+
      (complete?'הושלמו '+ex.sets+' מתוך '+ex.sets+' ✓':'סט '+(done+1)+' מתוך '+ex.sets)+'</div>'+
      '<div class="row"><button class="sq" data-act="setdn" aria-label="הפחת סט">&minus;</button>'+
      '<button class="sq" data-act="setup" aria-label="הוסף סט">+</button></div></div></div>'+
    '<div class="card"><div class="timer '+(running||paused?'run':'idle')+'" id="timer">'+
      fmtT(running?(s.tEnd-Date.now())/1000:paused?s.tPause/1000:ex.rest)+'</div>'+
      '<div class="small dim" style="text-align:center;margin-top:-8px;margin-bottom:8px">מנוחה '+ex.rest+' שנ׳</div>';
  if(running||paused){
    h+='<div class="row"><button class="grow" data-act="tpause">'+(paused?'המשך':'עצור')+'</button>'+
       '<button class="grow" data-act="tskip">דלג על טיימר</button></div>';
  }
  h+='</div>'+
    '<button class="pri big" data-act="setdone" '+(complete?'disabled':'')+'>סיימתי סט</button>'+
    '<div class="row" style="margin-top:12px"><button class="grow '+(complete?'pri':'')+'" data-act="next" style="min-height:64px">'+
      (s.i===n-1?'סיים אימון':'הבא')+'</button>'+
      '<button class="grow" data-act="skipex" style="min-height:64px">דלג על תרגיל</button></div>'+
    '<div class="row" style="margin-top:12px"><button class="grow small" data-act="prev" '+(s.i===0?'disabled':'')+'>&rarr; הקודם</button>'+
      '<button class="grow small" data-act="finish">סיום אימון</button></div>';
  return h;
}

function viewSummary(){
  var sm=ui.summary,h='<h1>סיכום אימון</h1><p class="dim">'+esc(sm.workout)+'</p>';
  if(!sm.items.length){
    h+='<div class="card"><p>לא בוצעו תרגילים באימון הזה.</p></div>'+
      '<button class="big" data-act="discard">חזרה</button>';
    return h;
  }
  sm.items.forEach(function(it,i){
    h+='<div class="card"><h2>'+esc(it.name)+'</h2>'+(repsText(it)?'<div class="dim small" style="margin-bottom:8px">יעד: '+repsText(it)+'</div>':'')+'<div class="row">'+
      '<div class="field"><label>משקל (ק״ג)</label><input id="sw'+i+'" inputmode="decimal" value="'+fmtW(it.weight)+'"></div>'+
      '<div class="field"><label>סטים</label><input id="ss'+i+'" inputmode="numeric" value="'+it.sets+'"></div></div></div>';
  });
  h+='<label class="chk"><input type="checkbox" id="upd" checked> עדכן את משקל העבודה בתוכנית</label>'+
    '<button class="pri big" data-act="savew" style="margin-top:8px">שמור אימון</button>'+
    '<button class="big" data-act="back2w" style="margin-top:12px">חזרה לאימון</button>';
  return h;
}

function viewLog(){
  var h='<h1>יומן</h1>';
  if(!S.log.length)return h+'<div class="card dim">עדיין אין אימונים ביומן.</div>';
  var idx=S.log.map(function(_,i){return i;}).sort(function(a,b){return S.log[b].ts-S.log[a].ts;});
  idx.forEach(function(i){
    var r=S.log[i];
    h+='<div class="card item" data-act="logopen" data-i="'+i+'"><h2>'+esc(r.workout)+'</h2>'+
      '<div class="dim small">'+esc(fmtDate(r.ts))+'</div><div class="dim small">'+r.items.length+' תרגילים</div></div>';
  });
  return h;
}

function viewLogDetail(){
  var r=S.log[ui.logIdx];
  if(!r)return viewLog();
  var h='<div class="row"><button class="sq" data-act="logback" aria-label="חזרה">&rarr;</button><h1 style="margin:0">'+esc(r.workout)+'</h1></div>'+
    '<p class="dim" style="margin-top:12px">'+esc(fmtDate(r.ts))+'</p>';
  r.items.forEach(function(it,i){
    h+='<div class="card"><h2>'+esc(it.name)+'</h2>'+(repsText(it)?'<div class="dim small" style="margin-bottom:8px">יעד: '+repsText(it)+'</div>':'')+'<div class="row">'+
      '<div class="field"><label>משקל (ק״ג)</label><input id="lw'+i+'" inputmode="decimal" value="'+fmtW(it.weight)+'"></div>'+
      '<div class="field"><label>סטים</label><input id="ls'+i+'" inputmode="numeric" value="'+it.sets+'"></div></div></div>';
  });
  h+='<button class="pri big" data-act="logsave">שמור שינויים</button>'+
    '<button class="dng big" data-act="logdel" style="margin-top:12px">מחק רשומה</button>';
  return h;
}

function viewPlan(){
  var h='<h1>תוכנית</h1>';
  S.plan.forEach(function(w,i){
    h+='<div class="card item" data-act="editw" data-i="'+i+'"><div class="row between"><h2 style="margin:0">'+esc(w.name)+'</h2>'+
      '<span class="tag">'+w.exercises.length+' תרגילים</span></div></div>';
  });
  return h;
}

function viewEdit(){
  var w=S.plan[ui.wi],ed=null;
  w.exercises.forEach(function(e){if(e.id===ui.editId)ed=e;});
  var h='<div class="row"><button class="sq" data-act="goplan" aria-label="חזרה">&rarr;</button><h1 style="margin:0">'+esc(w.name)+'</h1></div>';
  h+='<div class="card" style="margin-top:16px"><h2>'+(ed?'עריכת תרגיל':'הוסף תרגיל')+'</h2>'+
    '<label for="fn">שם התרגיל</label><input id="fn" value="'+esc(ed?ed.name:'')+'" style="margin-bottom:12px">'+
    '<div class="row"><div class="field"><label for="fw">משקל (ק״ג)</label><input id="fw" inputmode="decimal" value="'+(ed?fmtW(ed.weight):'')+'"></div>'+
    '<div class="field"><label for="fs">סטים</label><input id="fs" inputmode="numeric" value="'+(ed?ed.sets:3)+'"></div>'+
    '<div class="field"><label for="fr">מנוחה (שנ׳)</label><input id="fr" inputmode="numeric" value="'+(ed?ed.rest:90)+'"></div></div>'+
    '<div class="row" style="margin-top:12px"><div class="field"><label for="fmin">חזרות מינימום</label><input id="fmin" inputmode="numeric" value="'+(ed&&ed.repMin?ed.repMin:'')+'"></div>'+
    '<div class="field"><label for="fmax">חזרות מקסימום</label><input id="fmax" inputmode="numeric" value="'+(ed&&ed.repMax?ed.repMax:'')+'"></div></div>'+
    '<div id="ferr" class="err" hidden></div>'+
    '<button class="pri big" data-act="saveex" style="margin-top:12px">'+(ed?'שמור':'הוסף')+'</button>'+
    (ed?'<button class="big" data-act="canceledit" style="margin-top:12px">ביטול</button>':'')+'</div>';
  w.exercises.forEach(function(e,i){
    h+='<div class="card"><h2>'+esc(e.name)+'</h2><div class="dim small">'+fmtW(e.weight)+' ק״ג · '+e.sets+' סטים'+(repsText(e)?' · '+repsText(e):'')+' · מנוחה '+e.rest+' שנ׳</div>'+
      '<div class="row" style="margin-top:12px"><button class="sq" data-act="exup" data-id="'+e.id+'" '+(i===0?'disabled':'')+' aria-label="למעלה">&uarr;</button>'+
      '<button class="sq" data-act="exdn" data-id="'+e.id+'" '+(i===w.exercises.length-1?'disabled':'')+' aria-label="למטה">&darr;</button>'+
      '<button class="grow" data-act="exedit" data-id="'+e.id+'">עריכה</button>'+
      '<button class="grow dng" data-act="exdel" data-id="'+e.id+'">מחיקה</button></div></div>';
  });
  return h;
}

function viewBackup(){
  return '<h1>גיבוי</h1>'+
    '<div class="warnbox">הנתונים שמורים רק בטלפון הזה. כדאי לגבות מדי פעם.</div>'+
    '<div class="card"><h2>ייצוא</h2><p class="dim small">שמירת התוכנית והיומן לקובץ.</p><button class="pri big" data-act="export">ייצא גיבוי</button></div>'+
    '<div class="card"><h2>ייבוא</h2><p class="dim small">החלפת התוכנית והיומן בקובץ גיבוי.</p>'+
    '<button class="big" data-act="import">ייבא גיבוי</button>'+
    '<input type="file" id="file" accept="application/json,.json" hidden></div>';
}

/* ---------- render ---------- */
function render(){
  var sc=ui.screen,app=$('app'),nav=$('nav'),h;
  var focus=sc==='workout'||sc==='summary';
  if(sc==='home')h=viewHome();
  else if(sc==='workout')h=viewWorkout();
  else if(sc==='summary')h=viewSummary();
  else if(sc==='log')h=viewLog();
  else if(sc==='logd')h=viewLogDetail();
  else if(sc==='plan')h=viewPlan();
  else if(sc==='edit')h=viewEdit();
  else h=viewBackup();
  app.innerHTML=h;
  app.className=focus?'noNav':'';
  nav.style.display=focus?'none':'flex';
  var tab={home:'home',log:'log',logd:'log',plan:'plan',edit:'plan',backup:'backup'}[sc];
  var tabs=[['home','אימון'],['log','יומן'],['plan','תוכנית'],['backup','גיבוי']];
  nav.innerHTML=tabs.map(function(t){
    return '<button data-act="nav" data-s="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>';
  }).join('');
  $('ov').innerHTML=ui.alarm?'<div class="ov"><div>המנוחה נגמרה!</div><button data-act="alarmoff">המשך</button></div>':'';
  window.scrollTo(0,0);
}

/* ---------- timer ---------- */
function startTimer(sec){
  var s=S.session;
  s.tEnd=Date.now()+sec*1000;s.tPause=null;s.tTotal=sec;
}
function stopTimer(){
  var s=S.session;
  if(s){s.tEnd=null;s.tPause=null;}
}
setInterval(function(){
  var s=S.session;
  if(!s||ui.screen!=='workout'||!s.tEnd)return;
  var left=s.tEnd-Date.now();
  if(left<=0){
    s.tEnd=null;save();
    ui.alarm=true;beeps();render();
  }else{
    var t=$('timer');if(t)t.textContent=fmtT(left/1000);
  }
},250);

/* ---------- session ---------- */
function goWorkout(){
  ui.screen='workout';wakeOn();render();
}
function buildSummary(){
  var s=S.session,w=S.plan[s.w],items=[];
  w.exercises.forEach(function(e){
    var d=s.done[e.id]||0;
    if(d>0)items.push({id:e.id,name:e.name,weight:e.weight,sets:d,repMin:e.repMin,repMax:e.repMax});
  });
  ui.summary={workout:w.name,items:items,start:s.start};
}
function endSession(){
  stopTimer();ui.alarm=false;wakeOff();
  buildSummary();ui.screen='summary';save();render();
}
function leaveSession(){
  S.session=null;ui.summary=null;ui.alarm=false;wakeOff();save();
  ui.screen='home';render();
}
function gotoEx(i){
  var s=S.session,n=S.plan[s.w].exercises.length;
  stopTimer();ui.alarm=false;
  if(i>=n){endSession();return;}
  s.i=Math.max(0,i);save();render();
}

/* ---------- actions ---------- */
var A={
  nav:function(el){
    ui.screen=el.dataset.s;ui.editId=null;render();
  },
  goplan:function(){ui.screen='plan';ui.editId=null;render();},
  start:function(el){
    var i=+el.dataset.i;
    if(!S.plan[i].exercises.length){ui.wi=i;ui.screen='edit';render();return;}
    if(S.session&&!confirm('יש אימון בתהליך. להתחיל אימון חדש ולבטל אותו?'))return;
    S.session={w:i,i:0,done:{},tEnd:null,tPause:null,tTotal:0,start:Date.now()};
    save();goWorkout();
  },
  resume:function(){goWorkout();},
  setdone:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i],d=s.done[ex.id]||0;
    if(d>=ex.sets)return;
    s.done[ex.id]=d+1;
    if(ex.rest>0)startTimer(ex.rest);
    save();render();
  },
  setup:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    s.done[ex.id]=Math.min(ex.sets,(s.done[ex.id]||0)+1);save();render();
  },
  setdn:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    s.done[ex.id]=Math.max(0,(s.done[ex.id]||0)-1);save();render();
  },
  tpause:function(){
    var s=S.session;
    if(s.tEnd){s.tPause=Math.max(0,s.tEnd-Date.now());s.tEnd=null;}
    else if(s.tPause!=null){s.tEnd=Date.now()+s.tPause;s.tPause=null;}
    save();render();
  },
  tskip:function(){stopTimer();save();render();},
  alarmoff:function(){ui.alarm=false;render();},
  next:function(){gotoEx(S.session.i+1);},
  prev:function(){gotoEx(S.session.i-1);},
  skipex:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    delete s.done[ex.id];gotoEx(s.i+1);
  },
  finish:function(){if(confirm('לסיים את האימון ולעבור לסיכום?'))endSession();},
  exit:function(){if(confirm('לצאת מהאימון בלי לשמור?'))leaveSession();},
  discard:function(){leaveSession();},
  back2w:function(){goWorkout();},
  savew:function(){
    var sm=ui.summary,upd=$('upd').checked,s=S.session,items=[];
    sm.items.forEach(function(it,i){
      var w=Math.max(0,num($('sw'+i).value,it.weight)),n=Math.max(0,Math.round(num($('ss'+i).value,it.sets)));
      if(n>0)items.push({name:it.name,weight:w,sets:n,id:it.id,repMin:it.repMin,repMax:it.repMax});
    });
    if(!items.length){alert('אין תרגילים לשמירה.');return;}
    if(upd){
      var pl=S.plan[s.w];
      items.forEach(function(it){
        pl.exercises.forEach(function(e){if(e.id===it.id)e.weight=it.weight;});
      });
    }
    S.log.push({ts:Date.now(),workout:sm.workout,items:items.map(function(it){return {name:it.name,weight:it.weight,sets:it.sets,repMin:it.repMin||null,repMax:it.repMax||null};})});
    leaveSession();
  },
  logopen:function(el){ui.logIdx=+el.dataset.i;ui.screen='logd';render();},
  logback:function(){ui.screen='log';render();},
  logsave:function(){
    var r=S.log[ui.logIdx];
    r.items.forEach(function(it,i){
      it.weight=Math.max(0,num($('lw'+i).value,it.weight));
      it.sets=Math.max(0,Math.round(num($('ls'+i).value,it.sets)));
    });
    save();ui.screen='log';render();
  },
  logdel:function(){
    if(!confirm('למחוק את הרשומה מהיומן?'))return;
    S.log.splice(ui.logIdx,1);save();ui.screen='log';render();
  },
  editw:function(el){ui.wi=+el.dataset.i;ui.editId=null;ui.screen='edit';render();},
  saveex:function(){
    var name=$('fn').value.trim();
    if(!name){$('fn').focus();return;}
    var rmin=cleanRep($('fmin').value),rmax=cleanRep($('fmax').value),err=$('ferr');
    if(rmin&&rmax&&rmin>rmax){
      err.textContent='חזרות מינימום לא יכולות להיות גדולות מהמקסימום.';err.hidden=false;
      $('fmin').focus();return;
    }
    var w=S.plan[ui.wi],data=cleanEx({id:ui.editId||uid(),name:name,weight:$('fw').value,sets:$('fs').value,rest:$('fr').value,repMin:rmin,repMax:rmax});
    if(ui.editId){
      w.exercises=w.exercises.map(function(e){return e.id===ui.editId?data:e;});
    }else w.exercises.push(data);
    ui.editId=null;save();render();
  },
  exedit:function(el){ui.editId=el.dataset.id;render();},
  canceledit:function(){ui.editId=null;render();},
  exdel:function(el){
    if(!confirm('למחוק את התרגיל?'))return;
    var w=S.plan[ui.wi];
    w.exercises=w.exercises.filter(function(e){return e.id!==el.dataset.id;});
    if(ui.editId===el.dataset.id)ui.editId=null;
    save();render();
  },
  exup:function(el){moveEx(el.dataset.id,-1);},
  exdn:function(el){moveEx(el.dataset.id,1);},
  export:function(){doExport();},
  import:function(){$('file').click();}
};
function moveEx(id,d){
  var a=S.plan[ui.wi].exercises,i=a.findIndex(function(e){return e.id===id;}),j=i+d;
  if(i<0||j<0||j>=a.length)return;
  var t=a[i];a[i]=a[j];a[j]=t;save();render();
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var f=A[el.dataset.act];
  if(f)f(el);
});

/* ---------- backup ---------- */
function doExport(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  var name='workout-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  var text=JSON.stringify({app:'workout-app',version:1,exported:d.toISOString(),plan:S.plan,log:S.log},null,2);
  try{
    var file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(function(){});
      return;
    }
  }catch(e){}
  try{
    var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }catch(e){alert('הייצוא נכשל.');}
}
document.addEventListener('change',function(ev){
  if(ev.target.id!=='file')return;
  var f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var n=null;
    try{n=normalize(JSON.parse(rd.result));}catch(e){}
    if(!n){alert('קובץ הגיבוי לא תקין.');return;}
    if(!confirm('להחליף את התוכנית והיומן הנוכחיים ('+n.log.length+' אימונים ביומן)?'))return;
    S.plan=n.plan;S.log=n.log;S.session=null;save();
    ui.screen='home';render();
  };
  rd.onerror=function(){alert('קריאת הקובץ נכשלה.');};
  rd.readAsText(f);
});

/* ---------- boot ---------- */
S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(S.session)ui.screen='workout';
else if(total()===0){ui.screen='edit';ui.wi=0;}
if(ui.screen==='workout'){
  var s0=S.session,n0=S.plan[s0.w].exercises.length;
  if(!n0||s0.i>=n0){S.session=null;ui.screen='home';}
  else{
    wakeOn();
    if(s0.tEnd&&s0.tEnd<=Date.now()){s0.tEnd=null;ui.alarm=true;}
  }
}
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
