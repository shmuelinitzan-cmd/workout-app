<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אימונים</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אימונים">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B0B0D;--card:#141417;--card2:#1A1A1E;--line:#222228;--line2:#2A2A30;--track:#1E1E23;--text:#F4F4F6;--dim:#A1A1AA;--dim2:#71717A;--acc:#FF7A1A;--accText:#0B0B0D;--danger:#F0706B;--dangerLine:#5A2E2D}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:17px;font-weight:500;line-height:1.4;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 108px) calc(env(safe-area-inset-left) + 20px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#app.noNav{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.5px;margin:4px 0 4px;overflow-wrap:anywhere}
h2{font-size:18px;font-weight:700;margin:0;overflow-wrap:anywhere}
p{margin:0}
.dim{color:var(--dim)}
.dim2{color:var(--dim2)}
.small{font-size:14px}
.sec{font-size:14px;font-weight:500;color:var(--dim2);margin-top:6px}
.acc{color:var(--acc)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card.list{padding:4px 16px}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}
button{font:inherit;font-size:16px;font-weight:500;color:var(--text);background:transparent;border:1px solid var(--line2);border-radius:14px;min-height:50px;padding:0 16px;cursor:pointer;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.35}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accText);font-weight:800}
.pri:active{filter:brightness(.9)}
.soft{background:var(--card);border-color:transparent;color:var(--dim);min-height:46px;border-radius:12px;font-size:15px;padding:0 6px;white-space:nowrap}
.dng{color:var(--danger);border-color:var(--dangerLine)}
.big{min-height:64px;border-radius:18px;font-size:20px;width:100%}
.lnk{border:0;min-height:44px;color:var(--dim);font-size:15px}
.ib{width:48px;min-height:48px;padding:0;flex:none}
.ib.r{border-radius:24px}
.ib.s{width:44px;min-height:44px;border-radius:12px}
.ib.s .ico{width:18px;height:18px}
.full{width:100%}
input[type=text],input[type=number],input[type=date],input:not([type]){font:inherit;font-size:18px;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:12px;min-height:48px;padding:0 12px;width:100%;-webkit-appearance:none;appearance:none}
input[type=date]{min-width:0;text-align:right;padding:0 8px;font-size:17px}
input:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.field{flex:1;min-width:0}
.chk{display:flex;gap:12px;align-items:center;font-size:16px;color:var(--text);min-height:48px;margin:0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--acc)}
/* segmented control */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg.in{background:var(--bg);border:0;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;color:var(--dim);font-size:14px;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--line2);color:var(--text);font-weight:700}
.seg.acc button.on{background:var(--acc);color:var(--accText);font-weight:800}
/* switch */
.sw{width:52px;min-height:32px;height:32px;border-radius:16px;border:0;background:var(--line2);padding:3px;justify-content:flex-end;flex:none}
.sw i{width:26px;height:26px;border-radius:13px;background:var(--dim);display:block}
.sw.on{background:var(--acc);justify-content:flex-start}
.sw.on i{background:var(--bg)}
/* list rows */
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.item{cursor:pointer}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--dim)}
.badge{font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap}
.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pills i{width:22px;height:6px;border-radius:3px;background:var(--line2);display:block}
.pills i.on{background:var(--acc)}
.pills.w i{width:26px;height:8px;border-radius:4px}
.warnbox{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:14px;padding:12px 14px;font-size:15px}
.err{background:#2A1718;border:1px solid var(--dangerLine);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:15px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--track);padding:6px calc(env(safe-area-inset-right) + 4px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 4px);z-index:5}
nav button{flex:1;flex-direction:column;gap:4px;background:none;border:0;border-radius:0;font-size:12px;font-weight:500;color:#8E8E96;min-height:56px;padding:0 2px}
nav button .ico{width:24px;height:24px;stroke-width:1.8}
nav button.on{color:var(--acc);font-weight:700}
/* workout */
.wk{flex:1;display:flex;flex-direction:column;gap:20px}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wtop .t{font-size:15px;color:var(--dim);text-align:center}
.bar{height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.wname{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere;margin:0}
.wmeta{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:4px}
.wgt{font-size:30px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.wgt small{font-size:17px;font-weight:500}
.ring{position:relative;width:min(248px,72vw);aspect-ratio:1;margin:0 auto}
.ring>svg{position:absolute;inset:0;width:100%;height:100%}
.ring .rt{fill:none;stroke:var(--track);stroke-width:10}
.ring .ra{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.ring .lb{font-size:15px;color:var(--dim)}
.ring .tm{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring .sb{font-size:14px;color:var(--dim2)}
.ring .ok{color:var(--acc)}
.ring .ok .ico{width:56px;height:56px;stroke-width:2.2}
.setbox{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px}
.setbox .c{display:flex;flex-direction:column;align-items:center;gap:6px}
.setbox .c b{font-size:22px;font-weight:800}
.setbox .c b span{color:var(--dim2);font-weight:500}
.wbottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
/* home */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.wcard .nm{font-size:20px;font-weight:800}
.cur{background:var(--card);border:1px solid var(--acc);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}
/* log */
.lcard{width:100%;text-align:right;justify-content:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;gap:12px;min-height:0}
.lcard .d{width:48px;flex:none;text-align:center}
.lcard .d b{display:block;font-size:22px;font-weight:800;line-height:1}
.lcard .d span{font-size:12px;color:var(--dim)}
/* plan */
.excard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px}
.excard .mv{display:flex;flex-direction:column;gap:2px;flex:none}
.excard .mv button{width:36px;min-height:28px;padding:0;border:0;color:var(--dim2);border-radius:8px}
.excard .mv .ico{width:18px;height:18px}
.form{background:var(--card2);border:1px solid var(--acc);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.addbtn{border-style:dashed;border-color:#3A3A42;font-weight:700;min-height:52px}
/* progress */
.chart{width:100%;height:auto;display:block;direction:ltr;margin-top:8px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .c1{flex:2;min-width:0}
.trow .c2{flex:1;text-align:center;font-weight:800}
.trow .c3{flex:1;text-align:left;direction:ltr;color:var(--dim)}
.up{color:var(--acc)!important;font-weight:700}
.dn{color:var(--text)!important}
.bwf{gap:8px;align-items:flex-end}
.bwf button{min-height:48px;padding:0 14px}
/* rest-end overlay: flashes a few times to catch the eye, then stays */
.ov{position:fixed;inset:0;z-index:10;background:var(--acc);color:var(--accText);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 24px);text-align:center;animation:ovflash .5s ease-in-out 6}
.ov .t{font-size:15px;font-weight:700;opacity:.75}
.ov .mid{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.ov .mid .ico{width:64px;height:64px;stroke-width:2}
.ov h2{font-size:44px;line-height:1.05;font-weight:800}
.ov .ex{font-size:20px;font-weight:500}
.ov .w{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.ov .w small{font-size:17px;font-weight:500}
.ov button{width:100%;max-width:600px;min-height:68px;border-radius:18px;border:0;background:var(--bg);color:var(--text);font-size:21px;font-weight:800}
@keyframes ovflash{0%,100%{background:var(--acc)}50%{background:#FFFFFF}}
</style></head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="ov"></div>
<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var KEY='workout-app.v1';
var NAMES=['עליון A','תחתון A','עליון B','תחתון B'];
var storageOK=true;
var S;

function blank(){
  return {plan:NAMES.map(function(n){return {name:n,exercises:[]};}),log:[],bodyLog:[],settings:{endSound:'file',countdown:true,musicMix:false,push:false},session:null};
}
function cleanSettings(v){
  return {endSound:(v&&v.endSound==='beep')?'beep':'file',countdown:!(v&&v.countdown===false),musicMix:!!(v&&v.musicMix),push:!!(v&&v.push)};
}
function num(v,def){
  var n=parseFloat(String(v).replace(',','.'));
  return isFinite(n)?n:def;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

// Whole number >= 1, or null when missing/invalid (old data has no rep fields).
function cleanRep(v){
  if(v===null||v===undefined||v==='')return null;
  var n=Math.round(num(v,0));
  return n>=1?n:null;
}
function cleanEx(e){
  return {id:String(e.id||uid()),name:String(e.name||'').slice(0,80),
    weight:Math.max(0,num(e.weight,0)),sets:Math.max(1,Math.round(num(e.sets,3))),rest:Math.max(0,Math.round(num(e.rest,90))),
    repMin:cleanRep(e.repMin),repMax:cleanRep(e.repMax)};
}
function cleanLog(r){
  return {ts:num(r.ts,Date.now()),workout:String(r.workout||''),
    items:(Array.isArray(r.items)?r.items:[]).map(function(i){
      return {name:String(i.name||'').slice(0,80),weight:Math.max(0,num(i.weight,0)),sets:Math.max(0,Math.round(num(i.sets,0))),
        repMin:cleanRep(i.repMin),repMax:cleanRep(i.repMax)};
    })};
}
function cleanBody(r){
  var kg=num(r&&r.kg,0),ts=num(r&&r.ts,0);
  return kg>0&&ts>0?{ts:ts,kg:Math.round(kg*100)/100}:null;
}
function cleanBodyLog(a){
  return (Array.isArray(a)?a:[]).map(cleanBody).filter(Boolean).sort(function(x,y){return x.ts-y.ts;});
}
function repsText(o){
  var a=o.repMin,b=o.repMax;
  if(!a&&!b)return '';
  if(a&&b&&a!==b)return a+'-'+b+' חזרות';
  return (a||b)+' חזרות';
}
// Returns a clean {plan,log} or null when the shape is wrong.
function normalize(d){
  if(!d||!Array.isArray(d.plan)||d.plan.length!==4||!Array.isArray(d.log))return null;
  var out=blank();
  for(var i=0;i<4;i++){
    var w=d.plan[i];
    if(!w||!Array.isArray(w.exercises))return null;
    out.plan[i].exercises=w.exercises.map(cleanEx);
  }
  out.log=d.log.map(cleanLog);
  out.bodyLog=cleanBodyLog(d.bodyLog); // missing in older data/backups -> []
  out.settings=d.settings?cleanSettings(d.settings):null; // null = not in this data
  return out;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r),n=normalize(d);
      if(n){
        n.settings=n.settings||cleanSettings(null);
        var s=d.session;
        if(s&&typeof s.w==='number'&&s.w>=0&&s.w<4&&s.done&&typeof s.done==='object'){
          n.session={w:s.w,i:Math.max(0,s.i|0),done:s.done,tEnd:s.tEnd||null,tPause:s.tPause||null,tTotal:s.tTotal||0,start:s.start||Date.now()};
        }
        return n;
      }
    }
  }catch(e){storageOK=false;}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function fmtW(w){return String(Math.round(w*100)/100);}
function fmtDate(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+
    d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}
function fmtT(sec){
  sec=Math.max(0,Math.ceil(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function total(){return S.plan.reduce(function(a,w){return a+w.exercises.length;},0);}
function $(id){return document.getElementById(id);}

/* ---------- audio (iOS needs an unlock inside a user gesture) ---------- */
var actx=null;
var actxUnlocked=false;
function unlockAudio(force){
  try{
    // Default mode plays a media track and must not hold any audio session otherwise (it pauses Spotify).
    if(S.settings.musicMix!==true&&force!==true)return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state!=='running')actx.resume();
    if(!actxUnlocked){
      actxUnlocked=true;
      var b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();
      src.buffer=b;src.connect(actx.destination);src.start(0);
    }
  }catch(e){}
}
// timerend.mp3 is decoded once on an OfflineAudioContext (no audio session involved).
var endBuf=null,endLoading=false;
function loadEndSound(){
  if(endBuf||endLoading||S.settings.endSound!=='file')return;
  endLoading=true;
  try{
    fetch('./timerend.mp3').then(function(r){
      if(!r.ok)throw new Error('http');
      return r.arrayBuffer();
    }).then(function(ab){
      return new Promise(function(res,rej){
        var OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
        var p=new OC(1,1,44100).decodeAudioData(ab,res,rej);
        if(p&&p.then)p.then(res,rej);
      });
    }).then(function(buf){endBuf=buf;endLoading=false;}).catch(function(){endLoading=false;});
  }catch(e){endLoading=false;}
}
['touchend','pointerdown','click'].forEach(function(ev){document.addEventListener(ev,unlockAudio,{passive:true});});

function beeps(){
  try{
    if(!actx)unlockAudio(true);
    if(!actx){return;}
    // The context can be suspended/interrupted by iOS; play only once it is running again.
    if(actx.state==='running'){playEnd();return;}
    var done=false;
    function once(){if(done)return;done=true;playEnd();}
    try{
      var r=actx.resume();
      if(r&&r.then)r.then(once,once);else once();
    }catch(e){once();}
    setTimeout(once,400);
  }catch(e){oscBeeps();}
}
function playEnd(){
  try{
    if(S.settings.endSound==='file'&&endBuf){
      var s=actx.createBufferSource();
      s.buffer=endBuf;s.connect(actx.destination);s.start(0);
      return;
    }
  }catch(e){}
  oscBeeps();
}
function oscBeeps(){
  try{
    if(!actx)return;
    var t=actx.currentTime+0.05;
    [880,880,1175].forEach(function(f,k){
      var o=actx.createOscillator(),g=actx.createGain(),st=t+k*0.32;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.6,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.24);
      o.connect(g);g.connect(actx.destination);
      o.start(st);o.stop(st+0.26);
    });
  }catch(e){}
}

/* ---------- background-safe rest alarm ----------
   iOS freezes the page when the screen is off / app is in background, so timers and Web Audio stop.
   Media playback keeps running, so on timer start we play ONE pre-built track: silence for the rest time, then the alarm sound. */
var bg=null,bgUrl=null,alarmArmed=false,ALR=22050;
function dingSamples(){
  try{
    if(S.settings.endSound==='file'&&endBuf){
      var d=endBuf.getChannelData(0),ratio=endBuf.sampleRate/ALR,n=Math.floor(d.length/ratio),out=new Float32Array(n);
      for(var i=0;i<n;i++){
        var a=Math.floor(i*ratio),b=Math.max(a+1,Math.min(d.length,Math.floor((i+1)*ratio))),sum=0;
        for(var j=a;j<b;j++)sum+=d[j];
        out[i]=sum/(b-a);
      }
      return out;
    }
  }catch(e){}
  var freqs=[880,880,1175],len=Math.floor(ALR*0.9),o=new Float32Array(len);
  freqs.forEach(function(f,k){
    var st=Math.floor(k*0.32*ALR),m=Math.floor(0.26*ALR);
    for(var i=0;i<m&&st+i<len;i++){
      var t=i/ALR,env=t<0.02?t/0.02:Math.exp(-(t-0.02)*14);
      o[st+i]+=0.6*env*Math.sin(2*Math.PI*f*t);
    }
  });
  return o;
}
function buildAlarmWav(sec){
  var ding=dingSamples(),lead=Math.floor(sec*ALR),total=lead+ding.length+Math.floor(ALR*0.2);
  var buf=new ArrayBuffer(44+total*2),v=new DataView(buf);
  function str(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));}
  str(0,'RIFF');v.setUint32(4,36+total*2,true);str(8,'WAVE');str(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);

    if(S.settings.musicMix===true){scheduleFg(sec*1000);ps();return;}

var PUSH_URL='https://workout-push.nitzan-workout.workers.dev';
var VAPID_PUB='BLe2htAnoeknkYi0Pkk1vZ08dlISRnU9l4J3_k3PX8bYe5gIk8WQtQMi8XmxK-amw1C8Ci3VA8mVp2fbsBij7yc';

function pushPost(path,body,gen){

        .then(function(r){return r.ok;},function(){return false;});
    }catch(e){return Promise.resolve(false);}

    });

/* ---------- progress ---------- */
var MONTHS=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
var RANGES=[['m','חודש',30],['q','3 חודשים',91],['h','חצי שנה',182],['y','שנה',365],['a','הכל',0]];
var DAY=864e5;

function exKey(n){return String(n).trim();}
// Names that have at least one log record, most recently used first.
function exerciseNames(){
  var last=new Map();
  S.log.forEach(function(r){r.items.forEach(function(it){
    var k=exKey(it.name);
    if(k&&(!last.has(k)||r.ts>last.get(k)))last.set(k,r.ts);
  });});
  return Array.from(last.keys()).sort(function(a,b){return last.get(b)-last.get(a);});
}
// Only records whose weight differs from the previous record of the same exercise.
// The first record counts as the initial update.
function exerciseUpdates(name){
  var pts=[];
  S.log.forEach(function(r){r.items.forEach(function(it){
    if(exKey(it.name)===name)pts.push({ts:r.ts,v:it.weight});
  });});
  pts.sort(function(a,b){return a.ts-b.ts;});
  var out=[],prev=null;
  pts.forEach(function(p){if(prev===null||p.v!==prev)out.push(p);prev=p.v;});
  return out;
}
function lastWeight(name){
  var best=null;
  S.log.forEach(function(r){r.items.forEach(function(it){
    if(exKey(it.name)===name&&(!best||r.ts>=best.ts))best={ts:r.ts,v:it.weight};
  });});
  return best;
}
function fmtDay(ts){
  return new Date(ts).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
}
function fmtDelta(d){
  d=Math.round(d*100)/100;
  return (d>0?'+':d<0?'-':'')+fmtW(Math.abs(d));
}
function ymd(ts){
  var d=new Date(ts),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

// pts: [{ts,v}] ascending. Hand-written SVG, real time axis, always LTR (old -> new).
function chartSvg(pts){
  var W=360,H=230,L=46,R=14,T=16,B=40,pw=W-L-R,ph=H-T-B;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף התקדמות">';
  var txt=function(x,y,t,a,c){return '<text x="'+x+'" y="'+y+'" text-anchor="'+a+'" fill="'+(c||'#8E8E96')+'" font-size="12">'+t+'</text>';};
  if(pts.length<2){
    var v=pts[0].v;
    s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#222228"/>'+
      '<circle cx="'+(L+pw/2)+'" cy="'+(T+ph/2)+'" r="6" fill="#FF7A1A"/>'+
      txt(L+pw/2,T+ph/2-14,fmtW(v),'middle','#F2F2F4');
    return s+'</svg>';
  }
  var rg=RANGES.filter(function(r){return r[0]===ui.range;})[0]||RANGES[2];
  var end=Math.max(Date.now(),pts[pts.length-1].ts);
  var start=rg[2]?end-rg[2]*DAY:pts[0].ts;
  if(end<=start)end=start+DAY;
  var anchor=null,inside=[];
  pts.forEach(function(p){if(p.ts<start)anchor=p;else inside.push(p);});
  var ser=[];
  if(anchor)ser.push({ts:start,v:anchor.v,dot:false});
  inside.forEach(function(p){ser.push({ts:p.ts,v:p.v,dot:true});});
  if(ser.length===1&&anchor)ser.push({ts:end,v:anchor.v,dot:false}); // flat line, no update in range
  var vals=ser.map(function(p){return p.v;}),dmin=Math.min.apply(null,vals),dmax=Math.max.apply(null,vals);
  var mn=dmin,mx=dmax;
  if(mn===mx){mn-=1;mx+=1;}else{var pad=(mx-mn)*0.15;mn-=pad;mx+=pad;}
  var X=function(ts){return L+(ts-start)/(end-start)*pw;};
  var Y=function(v){return T+(1-(v-mn)/(mx-mn))*ph;};
  // month grid
  var months=(end-start)/(30.4*DAY),step=Math.max(1,Math.ceil(months/6)),lineStep=months<=12?1:step;
  var d=new Date(start),cur=new Date(d.getFullYear(),d.getMonth()+1,1),i=0;
  var crossYear=new Date(start).getFullYear()!==new Date(end).getFullYear();
  var yearAt=[];
  while(cur.getTime()<=end){
    var x=X(cur.getTime()),m=cur.getMonth();
    if(i%lineStep===0)s+='<line x1="'+x.toFixed(1)+'" y1="'+T+'" x2="'+x.toFixed(1)+'" y2="'+(T+ph)+'" stroke="#222228"/>';
    if(i%step===0){
      s+=txt(x.toFixed(1),T+ph+16,MONTHS[m],'middle');
      if(crossYear&&m===0){s+=txt(x.toFixed(1),T+ph+31,cur.getFullYear(),'middle','#F2F2F4');yearAt.push(x);}
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);i++;
  }
  if(crossYear&&!yearAt.some(function(x){return x<L+44;})){
    s+=txt(L,T+ph+31,new Date(start).getFullYear(),'start','#F2F2F4');
  }
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#3A3A42"/>';
  s+=txt(L-6,Y(dmax)+4,fmtW(dmax),'end');
  if(dmin!==dmax)s+=txt(L-6,Y(dmin)+4,fmtW(dmin),'end');
  s+='<polyline fill="none" stroke="#FF7A1A" stroke-width="2" stroke-linejoin="round" points="'+
    ser.map(function(p){return X(p.ts).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ')+'"/>';
  ser.forEach(function(p){
    if(p.dot)s+='<circle cx="'+X(p.ts).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="#FF7A1A" stroke="#0B0B0D" stroke-width="1.5"/>';
  });
  return s+'</svg>';
}
function rangeBar(){
  return '<div class="seg">'+RANGES.map(function(r){
    return '<button data-act="range" data-r="'+r[0]+'" class="'+(r[0]===ui.range?'on':'')+'">'+r[1]+'</button>';
  }).join('')+'</div>';
}
function chartBlock(pts,accentUp){
  if(!pts.length)return '<div class="card dim">אין עדיין נתונים.</div>';
  var lastV=pts[pts.length-1].v,d=lastV-pts[0].v;
  var head='<div class="row between" style="align-items:flex-start"><div><div class="dim small">עכשיו</div>'+
    '<div class="num" style="font-size:30px;font-weight:800">'+fmtW(lastV)+' <span class="small dim">ק״ג</span></div></div>'+
    (pts.length>1?'<div class="small '+(accentUp&&d>0?'up':'dim')+'" style="margin-top:6px"><bdi dir="ltr">'+fmtDelta(d)+'</bdi> מההתחלה</div>':'')+'</div>';
  if(pts.length<2)return '<div class="card">'+head+chartSvg(pts)+'<p class="dim small" style="text-align:center;margin-top:8px">אין עדיין מספיק נתונים לגרף</p></div>';
  return rangeBar()+'<div class="card">'+head+chartSvg(pts)+'</div>';
}

    (ui.pkind==='body'?'משקל גוף':esc(ui.pk))+'</h1></div>';

      var idx=pts.map(function(_,i){return i;}).reverse();
      var shown=ui.bodyAll?idx:idx.slice(0,5);
      h+='<div class="card"><h2>'+(ui.bodyAll?'כל השקילות':'5 שקילות אחרונות')+'</h2>';
      shown.forEach(function(i){
        var dl=i===0?'התחלה':fmtDelta(pts[i].v-pts[i-1].v);
        h+='<div style="border-bottom:1px solid var(--line);padding:4px 0 12px;margin-bottom:4px"><div class="trow" style="border:0;padding-bottom:8px"><div class="c1">'+esc(fmtDay(pts[i].ts))+'</div>'+
          '<div class="c2">'+fmtW(pts[i].v)+'</div><div class="c3">'+dl+'</div></div>'+
          '<div class="row"><button class="grow" data-act="bodyedit" data-i="'+i+'" style="min-height:44px">עריכה</button>'+
          '<button class="grow dng" data-act="bodydel" data-i="'+i+'" style="min-height:44px">מחיקה</button></div></div>';
      });
      if(!ui.bodyAll&&pts.length>5)h+='<button class="full" data-act="bodyall" style="margin-top:8px">הצג הכל ('+pts.length+')</button>';
      else if(ui.bodyAll&&pts.length>5)h+='<button class="full" data-act="bodyall" style="margin-top:8px">הצג 5 אחרונות</button>';
      h+='</div>';
    }
    return h;
  }
  var ups=exerciseUpdates(ui.pk);
  h+=chartBlock(ups,true);
  if(ups.length){
    h+='<div class="card"><h2>5 עדכוני משקל אחרונים</h2>';
    ups.map(function(_,i){return i;}).reverse().slice(0,5).forEach(function(i){
      var dl=i===0?'התחלה':fmtDelta(ups[i].v-ups[i-1].v);
      h+='<div class="trow"><div class="c1">'+esc(fmtDay(ups[i].ts))+'</div><div class="c2">'+fmtW(ups[i].v)+'</div>'+
        '<div class="c3 '+(dl[0]==='+'?'up':dl[0]==='-'?'dn':'')+'">'+dl+'</div></div>';
    });
    h+='</div>';
  }
  return h;
}

function viewAlarm(){
  var s=S.session,top='',ex=null,line='',wl='';
  try{
    var w=S.plan[s.w];ex=w.exercises[s.i];
    var d=s.done[ex.id]||0;
    top=esc(w.name)+' · תרגיל '+(s.i+1)+' מתוך '+w.exercises.length;
    line=esc(ex.name)+' · '+(d<ex.sets?'סט '+(d+1)+' מתוך '+ex.sets:'כל הסטים הושלמו');
    wl='<div class="w">'+fmtW(ex.weight)+' <small>ק״ג</small>'+(repsText(ex)?' · '+repsText(ex):'')+'</div>';
  }catch(e){}
  return '<div class="ov" role="alertdialog" aria-label="המנוחה נגמרה"><div class="t">'+top+'</div>'+
    '<div class="mid">'+ic('clock')+'<h2>המנוחה נגמרה</h2>'+(line?'<div class="ex">'+line+'</div>':'')+wl+'</div>'+
    '<button data-act="alarmoff">יאללה, לסט הבא</button></div>';
}

/* ---------- render ---------- */
function render(keep){
  var sc=ui.screen,app=$('app'),nav=$('nav'),h;
  var focus=sc==='workout'||sc==='summary';
  if(sc==='home')h=viewHome();
  else if(sc==='workout')h=viewWorkout();
  else if(sc==='summary')h=viewSummary();
  else if(sc==='log')h=viewLog();
  else if(sc==='logd')h=viewLogDetail();
  else if(sc==='prog')h=viewProg();
  else if(sc==='progd')h=viewProgDetail();
  else if(sc==='plan')h=viewPlan();
  else if(sc==='edit')h=viewEdit();
  else h=viewBackup();
  app.innerHTML=h;
  app.className=focus?'noNav':'';
  nav.style.display=focus?'none':'flex';
  var tab={home:'home',log:'log',logd:'log',prog:'prog',progd:'prog',plan:'plan',edit:'plan',backup:'backup'}[sc];
  var tabs=[['home','אימון','dumbbell'],['log','יומן','log'],['prog','התקדמות','trend'],['plan','תוכנית','list'],['backup','הגדרות','sliders']];
  nav.innerHTML=tabs.map(function(t){
    return '<button data-act="nav" data-s="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+ic(t[2])+'<span>'+t[1]+'</span></button>';
  }).join('');
  // Rest-end overlay. Built only when it first appears, so later renders do not restart its flashing.
  var ov=$('ov');
  if(!ui.alarm)ov.innerHTML='';
  else if(!ov.firstChild)ov.innerHTML=viewAlarm();
  if(sc==='backup')showVer();
  if(keep!==true)window.scrollTo(0,0);
}
// Which app version this phone has installed (name of the service worker's cache), shown at the bottom of the settings tab.
function showVer(){
  try{
    if(!('caches' in window))return;
    caches.keys().then(function(ks){
      var v=ks.filter(function(k){return k.indexOf('workout-app-')===0;}).sort().pop()||'';
      var el=$('ver');
      if(el&&v)el.textContent='גרסה '+v.replace('workout-app-','');
    });
  }catch(e){}
}

/* ---------- timer ---------- */
function startTimer(sec){
  var s=S.session;
  s.tEnd=Date.now()+sec*1000;s.tPause=null;s.tTotal=sec;
  armAlarm(sec);
}
function stopTimer(){
  var s=S.session;
  if(s){s.tEnd=null;s.tPause=null;}
  disarmAlarm();
}
setInterval(function(){
  var s=S.session;
  if(!s||ui.screen!=='workout'||!s.tEnd)return;
  var left=s.tEnd-Date.now();
  if(left<=0){
    s.tEnd=null;save();
    ui.alarm=true;
    // Only when on screen: a page that is hidden but still running may not be audible, and the notification must then stay.
    if(document.visibilityState==='visible')pushCancel();
    var played=alarmArmed&&(alarmPlayed||(bg&&!bg.paused));
    alarmArmed=false;
    if(!played)beeps();
    render();
  }else{
    // The app is on screen and will sound the alarm itself, so drop the notification (a hidden page is frozen and cannot do this).
    if(pushArmed&&left<4000&&document.visibilityState==='visible')pushCancel();
    var t=$('timer');if(t)t.textContent=fmtT(left/1000);
    var a=$('rarc');if(a)a.setAttribute('stroke-dashoffset',ringOff(s));
  }
},250);

/* ---------- session ---------- */
function goWorkout(){
  ui.screen='workout';wakeOn();render();
}
function buildSummary(){
  var s=S.session,w=S.plan[s.w],items=[];
  w.exercises.forEach(function(e){
    var d=s.done[e.id]||0;
    if(d>0)items.push({id:e.id,name:e.name,weight:e.weight,sets:d,repMin:e.repMin,repMax:e.repMax});
  });
  ui.summary={workout:w.name,items:items,start:s.start};
}
function endSession(){
  stopTimer();ui.alarm=false;wakeOff();
  buildSummary();ui.screen='summary';save();render();
}
function leaveSession(){
  disarmAlarm(); // also cancels a pending notification
  S.session=null;ui.summary=null;ui.alarm=false;wakeOff();save();
  ui.screen='home';render();
}
function gotoEx(i){
  var s=S.session,n=S.plan[s.w].exercises.length;
  stopTimer();ui.alarm=false;
  if(i>=n){endSession();return;}
  s.i=Math.max(0,i);save();render();
}

/* ---------- actions ---------- */
var A={
  nav:function(el){
    ui.screen=el.dataset.s;ui.editId=null;ui.pushMsg='';render();
  },
  goplan:function(){ui.screen='plan';ui.editId=null;render();},
  start:function(el){
    var i=+el.dataset.i;
    if(!S.plan[i].exercises.length){ui.wi=i;ui.screen='edit';render();return;}
    if(S.session&&!confirm('יש אימון בתהליך. להתחיל אימון חדש ולבטל אותו?'))return;
    S.session={w:i,i:0,done:{},tEnd:null,tPause:null,tTotal:0,start:Date.now()};
    save();goWorkout();
  },
  resume:function(){goWorkout();},
  setdone:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i],d=s.done[ex.id]||0;
    if(d>=ex.sets)return;
    s.done[ex.id]=d+1;
    if(ex.rest>0)startTimer(ex.rest);
    save();render();
  },
  setup:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    s.done[ex.id]=Math.min(ex.sets,(s.done[ex.id]||0)+1);save();render();
  },
  setdn:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    s.done[ex.id]=Math.max(0,(s.done[ex.id]||0)-1);save();render();
  },
  tpause:function(){
    var s=S.session;
    if(s.tEnd){s.tPause=Math.max(0,s.tEnd-Date.now());s.tEnd=null;disarmAlarm();}
    else if(s.tPause!=null){armAlarm(s.tPause/1000);s.tEnd=Date.now()+s.tPause;s.tPause=null;}
    save();render();
  },
  tskip:function(){stopTimer();save();render();},
  alarmoff:function(){ui.alarm=false;render();},
  next:function(){gotoEx(S.session.i+1);},
  prev:function(){gotoEx(S.session.i-1);},
  skipex:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    delete s.done[ex.id];gotoEx(s.i+1);
  },
  finish:function(){if(confirm('לסיים את האימון ולעבור לסיכום?'))endSession();},
  exit:function(){if(confirm('לצאת מהאימון בלי לשמור?'))leaveSession();},
  discard:function(){leaveSession();},
  back2w:function(){goWorkout();},
  savew:function(){
    var sm=ui.summary,upd=$('upd').checked,s=S.session,items=[];
    sm.items.forEach(function(it,i){
      var w=Math.max(0,num($('sw'+i).value,it.weight)),n=Math.max(0,Math.round(num($('ss'+i).value,it.sets)));
      if(n>0)items.push({name:it.name,weight:w,sets:n,id:it.id,repMin:it.repMin,repMax:it.repMax});
    });
    if(!items.length){alert('אין תרגילים לשמירה.');return;}
    if(upd){
      var pl=S.plan[s.w];
      items.forEach(function(it){
        pl.exercises.forEach(function(e){if(e.id===it.id)e.weight=it.weight;});
      });
    }
    S.log.push({ts:Date.now(),workout:sm.workout,items:items.map(function(it){return {name:it.name,weight:it.weight,sets:it.sets,repMin:it.repMin||null,repMax:it.repMax||null};})});
    leaveSession();
  },
  logopen:function(el){ui.logIdx=+el.dataset.i;ui.screen='logd';render();},
  logback:function(){ui.screen='log';render();},
  logsave:function(){
    var r=S.log[ui.logIdx];
    r.items.forEach(function(it,i){
      it.weight=Math.max(0,num($('lw'+i).value,it.weight));
      it.sets=Math.max(0,Math.round(num($('ls'+i).value,it.sets)));
    });
    save();ui.screen='log';render();
  },
  logdel:function(){
    if(!confirm('למחוק את הרשומה מהיומן?'))return;
    S.log.splice(ui.logIdx,1);save();ui.screen='log';render();
  },
  editw:function(el){ui.wi=+el.dataset.i;ui.editId=null;ui.screen='plan';render();},
  saveex:function(){
    var name=$('fn').value.trim();
    if(!name){$('fn').focus();return;}
    var rmin=cleanRep($('fmin').value),rmax=cleanRep($('fmax').value),err=$('ferr');
    if(rmin&&rmax&&rmin>rmax){
      err.textContent='חזרות מינימום לא יכולות להיות גדולות מהמקסימום.';err.hidden=false;
      $('fmin').focus();return;
    }
    var isEdit=!!ui.editId&&ui.editId!=='new';
    var w=S.plan[ui.wi],data=cleanEx({id:isEdit?ui.editId:uid(),name:name,weight:$('fw').value,sets:$('fs').value,rest:$('fr').value,repMin:rmin,repMax:rmax});
    if(isEdit){
      w.exercises=w.exercises.map(function(e){return e.id===ui.editId?data:e;});
    }else w.exercises.push(data);
    ui.editId=null;save();render();
  },
  exedit:function(el){ui.editId=el.dataset.id;render(true);},
  exnew:function(){ui.editId='new';render(true);var f=$('fn');if(f)f.focus();},
  canceledit:function(){ui.editId=null;render();},
  exdel:function(el){
    if(!confirm('למחוק את התרגיל?'))return;
    var w=S.plan[ui.wi];
    w.exercises=w.exercises.filter(function(e){return e.id!==el.dataset.id;});
    if(ui.editId===el.dataset.id)ui.editId=null;
    save();render();
  },
  exup:function(el){moveEx(el.dataset.id,-1);},
  exdn:function(el){moveEx(el.dataset.id,1);},
  progbody:function(){ui.pkind='body';ui.bodyEdit=null;ui.bodyAll=false;ui.screen='progd';render();},
  progex:function(el){ui.pkind='ex';ui.pk=el.dataset.k;ui.screen='progd';render();},
  progback:function(){ui.screen='prog';render();},
  range:function(el){ui.range=el.dataset.r;render(true);},
  bodyall:function(){ui.bodyAll=!ui.bodyAll;render(true);},
  bodyedit:function(el){ui.bodyEdit=+el.dataset.i;render();},
  bodycancel:function(){ui.bodyEdit=null;render(true);},
  bodydel:function(el){
    if(!confirm('למחוק את השקילה?'))return;
    S.bodyLog.splice(+el.dataset.i,1);ui.bodyEdit=null;save();render(true);
  },
  bodysave:function(){
    var err=$('berr'),kg=num($('bw').value,0),v=$('bd').value,m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    var fail=function(t){err.textContent=t;err.hidden=false;};
    if(!(kg>0)||kg>500)return fail('יש להזין משקל גדול מאפס.');
    if(!m)return fail('יש לבחור תאריך.');
    if(v>ymd(Date.now()))return fail('לא ניתן לבחור תאריך עתידי.');
    var old=ui.bodyEdit!=null?S.bodyLog[ui.bodyEdit]:null,ts;
    if(old&&ymd(old.ts)===v)ts=old.ts;
    else if(v===ymd(Date.now()))ts=Date.now();
    else ts=new Date(+m[1],+m[2]-1,+m[3],12).getTime();
    var rec={ts:ts,kg:Math.round(kg*100)/100};
    if(old)S.bodyLog.splice(ui.bodyEdit,1);
    S.bodyLog.push(rec);
    S.bodyLog.sort(function(a,b){return a.ts-b.ts;});
    ui.bodyEdit=null;save();render(true);
  },
  sndfile:function(){S.settings.endSound='file';save();loadEndSound();render(true);},
  sndbeep:function(){S.settings.endSound='beep';save();render(true);},
  sndtry:function(){unlockAudio(true);beeps();},
  mixon:function(){S.settings.musicMix=true;save();render(true);},
  mixoff:function(){S.settings.musicMix=false;save();render(true);},
  pushon:function(){
    // Must start inside the tap: iOS only shows the permission prompt for a user gesture.
    if(!pushSupported())return;
    ui.pushMsg='';
    var perm;
    try{perm=Notification.requestPermission();}catch(e){perm=Promise.resolve('denied');}
    Promise.resolve(perm).then(function(p){
      if(p!=='granted')throw new Error('denied');
      return navigator.serviceWorker.ready;
    }).then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        return sub||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUB)});
      });
    }).then(function(sub){
      pushSub=sub.toJSON();S.settings.push=true;save();ui.pushMsg='';render(true);
    }).catch(function(e){
      ui.pushMsg=(e&&e.message==='denied')?'ההרשאה לא ניתנה. אפשר לאשר אותה בהגדרות האייפון ← התראות ← אימונים.':'ההפעלה נכשלה. ודא שהאפליקציה נפתחת ממסך הבית ושיש חיבור לאינטרנט.';
      render(true);
    });
  },
  pushoff:function(){S.settings.push=false;pushCancel();ui.pushMsg='';save();render(true);},
  pushtry:function(){
    if(!pushOn())return;
    pushMeta({title:'בדיקת התראה',body:'ההתראה עובדת גם כשהמסך כבוי'});
    pushPost('/schedule',{sub:{endpoint:pushSub.endpoint},delay:8});
    ui.pushMsg='ההתראה תגיע בעוד 8 שניות. נעל את המסך עכשיו.';render(true);
  },
  cdon:function(){S.settings.countdown=true;save();render(true);},
  cdoff:function(){S.settings.countdown=false;save();render(true);},
  cdtry:function(){
    // Preview only: force the countdown on while the demo is built, then restore the saved setting.
    unlockAudio(true);
    var prev=S.settings.countdown;
    S.settings.countdown=true;
    try{armAlarm(7,true);}finally{S.settings.countdown=prev;}
    if(S.settings.musicMix===true)setTimeout(beeps,7000);
  },
  export:function(){doExport();},
  import:function(){$('file').click();}
};
function moveEx(id,d){
  var a=S.plan[ui.wi].exercises,i=a.findIndex(function(e){return e.id===id;}),j=i+d;
  if(i<0||j<0||j>=a.length)return;
  var t=a[i];a[i]=a[j];a[j]=t;save();render();
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var f=A[el.dataset.act];
  if(f)f(el);
});

/* ---------- backup ---------- */
function doExport(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  var name='workout-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  var text=JSON.stringify({app:'workout-app',version:1,exported:d.toISOString(),plan:S.plan,log:S.log,bodyLog:S.bodyLog,settings:S.settings},null,2);
  try{
    var file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(function(){});
      return;
    }
  }catch(e){}
  try{
    var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }catch(e){alert('הייצוא נכשל.');}
}
document.addEventListener('change',function(ev){
  if(ev.target.id!=='file')return;
  var f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var n=null;
    try{n=normalize(JSON.parse(rd.result));}catch(e){}
    if(!n){alert('קובץ הגיבוי לא תקין.');return;}
    if(!confirm('להחליף את התוכנית והיומן הנוכחיים ('+n.log.length+' אימונים ביומן)?'))return;
    S.plan=n.plan;S.log=n.log;S.bodyLog=n.bodyLog;if(n.settings)S.settings=n.settings;S.session=null;save();
    ui.screen='home';render();
  };
  rd.onerror=function(){alert('קריאת הקובץ נכשלה.');};
  rd.readAsText(f);
});

/* ---------- boot ---------- */
S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(S.session)ui.screen='workout';
else if(total()===0){ui.screen='edit';ui.wi=0;}
if(ui.screen==='workout'){
  var s0=S.session,n0=S.plan[s0.w].exercises.length;
  if(!n0||s0.i>=n0){S.session=null;ui.screen='home';}
  else{
    wakeOn();
    if(s0.tEnd&&s0.tEnd<=Date.now()){s0.tEnd=null;ui.alarm=true;}
  }
}
loadEndSound();
render();
pushInit();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
