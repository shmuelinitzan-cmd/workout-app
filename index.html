<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אימונים</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אימונים">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0D0D0F;--card:#1A1A1E;--line:#26262B;--line2:#3A3A42;--text:#F2F2F4;--dim:#8E8E96;--acc:#FF7A1A;--accText:#0D0D0F;--danger:#F0706B}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:500;line-height:1.4;overflow-x:hidden;touch-action:manipulation}
#app{min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 100px) calc(env(safe-area-inset-left) + 18px);max-width:640px;margin:0 auto}
#app.noNav{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:30px;font-weight:700;margin:8px 0 20px;overflow-wrap:anywhere}
h2{font-size:22px;font-weight:700;margin:0 0 8px;overflow-wrap:anywhere}
p{margin:0 0 12px}
.dim{color:var(--dim)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;min-width:0}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.between{justify-content:space-between}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor}
button,.btn{font:inherit;font-size:19px;font-weight:700;color:var(--text);background:transparent;border:1.5px solid var(--line2);border-radius:14px;min-height:56px;padding:0 18px;cursor:pointer;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{background:#232328}
button:disabled{opacity:.4}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accText)}
.pri:active{background:var(--acc);filter:brightness(.9)}
.dng{color:var(--danger);border-color:#5A2E2D}
.big{min-height:72px;font-size:22px;width:100%}
.sq{width:56px;padding:0;flex:none}
.bt{font-size:15px;font-weight:500;min-height:52px;border-radius:12px;padding:0 12px;white-space:nowrap}
.bt-pri{font-size:18px;font-weight:700;min-height:56px;width:100%}
.bt-main{font-size:16px;font-weight:600;min-height:54px}
.bt-sec{font-size:14px;font-weight:500;min-height:52px}
.bt-ico{width:52px;padding:0;flex:none;min-height:52px}
.bt-ico .ico{width:20px;height:20px}
.bt-ico.s{width:44px;min-height:44px}
.bt-sm{font-size:14px;font-weight:500;min-height:44px;border-radius:12px;padding:0 16px;white-space:nowrap}
.bwf{gap:8px;align-items:flex-end}
.bwf label{font-size:14px;white-space:nowrap}
.row.bwf input{font-size:17px;min-height:48px;padding:0 8px}
.bwf button{padding:0 12px;min-height:48px}
.play{width:64px;height:64px;border-radius:50%;padding:0;flex:none;background:var(--acc);border-color:var(--acc);color:var(--accText)}
.play:active{background:var(--acc);filter:brightness(.9)}
.play .ico{width:26px;height:26px}
input[type=text],input[type=number],input[type=date],input:not([type]){font:inherit;font-size:20px;color:var(--text);background:var(--bg);border:1.5px solid var(--line2);border-radius:12px;min-height:56px;padding:0 14px;width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;text-align:right;padding:0 8px;font-size:18px}
input:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:15px;color:var(--dim);margin-bottom:4px}
.field{flex:1;min-width:0}
.chk{display:flex;gap:12px;align-items:center;font-size:20px;color:var(--text);min-height:56px;margin:0}
.chk input{width:28px;height:28px;flex:none;accent-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav button{flex:1;flex-direction:column;gap:4px;background:none;border:0;border-radius:0;font-size:12px;font-weight:500;color:var(--dim);min-height:62px;padding:6px 2px}
nav button .ico{width:24px;height:24px}
nav button.on{color:var(--acc)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 20px}
.prog i{display:block;height:100%;background:var(--acc)}
.wname{font-size:32px;font-weight:700;margin:8px 0 4px;overflow-wrap:anywhere}
.wgt{font-size:28px;color:var(--acc);font-weight:700;margin-bottom:18px}
.reps{color:var(--text)}
.err{background:#2A1718;border:1px solid #5A2E2D;color:var(--danger);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:17px}
.ring{position:relative;width:min(196px,100%);aspect-ratio:1;margin:0 auto 6px}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .rt{fill:none;stroke:var(--line);stroke-width:3}
.ring .ra{fill:none;stroke:var(--acc);stroke-width:3;transform:rotate(-90deg);transform-origin:60px 60px}
.timer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.idle{color:var(--dim)}
.setc{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.setc .ico{color:var(--acc);width:22px;height:22px}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:8px;padding:2px 10px;font-size:15px;color:var(--dim)}
.ov{position:fixed;inset:0;background:var(--acc);color:var(--accText);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:10;font-size:38px;font-weight:700;text-align:center;padding:24px}
.ov button{background:var(--bg);border-color:var(--bg);color:var(--text);width:80%}
.sep{height:1px;background:var(--line);margin:12px 0}
.warnbox{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:16px}
.item{cursor:pointer}
.chart{width:100%;height:auto;display:block;direction:ltr}
.rng{display:flex;gap:6px;margin-bottom:14px}
.rng button{flex:1;font-size:14px;font-weight:500;min-height:40px;border-radius:10px;padding:0 2px;line-height:1.15;white-space:nowrap}
.rng button.on{background:var(--acc);border-color:var(--acc);color:var(--accText)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .c1{flex:2;min-width:0}
.trow .c2{flex:1;text-align:center;font-weight:700}
.trow .c3{flex:1;text-align:left;direction:ltr;color:var(--dim)}
.up{color:var(--acc)!important}
.dn{color:var(--text)!important}
</style></head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="ov"></div>
<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var KEY='workout-app.v1';
var NAMES=['עליון A','תחתון A','עליון B','תחתון B'];
var storageOK=true;
var S;

function blank(){
  return {plan:NAMES.map(function(n){return {name:n,exercises:[]};}),log:[],bodyLog:[],session:null};
}
function num(v,def){
  var n=parseFloat(String(v).replace(',','.'));
  return isFinite(n)?n:def;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

// Whole number >= 1, or null when missing/invalid (old data has no rep fields).
function cleanRep(v){
  if(v===null||v===undefined||v==='')return null;
  var n=Math.round(num(v,0));
  return n>=1?n:null;
}
function cleanEx(e){
  return {id:String(e.id||uid()),name:String(e.name||'').slice(0,80),
    weight:Math.max(0,num(e.weight,0)),sets:Math.max(1,Math.round(num(e.sets,3))),rest:Math.max(0,Math.round(num(e.rest,90))),
    repMin:cleanRep(e.repMin),repMax:cleanRep(e.repMax)};
}
function cleanLog(r){
  return {ts:num(r.ts,Date.now()),workout:String(r.workout||''),
    items:(Array.isArray(r.items)?r.items:[]).map(function(i){
      return {name:String(i.name||'').slice(0,80),weight:Math.max(0,num(i.weight,0)),sets:Math.max(0,Math.round(num(i.sets,0))),
        repMin:cleanRep(i.repMin),repMax:cleanRep(i.repMax)};
    })};
}
function cleanBody(r){
  var kg=num(r&&r.kg,0),ts=num(r&&r.ts,0);
  return kg>0&&ts>0?{ts:ts,kg:Math.round(kg*100)/100}:null;
}
function cleanBodyLog(a){
  return (Array.isArray(a)?a:[]).map(cleanBody).filter(Boolean).sort(function(x,y){return x.ts-y.ts;});
}
function repsText(o){
  var a=o.repMin,b=o.repMax;
  if(!a&&!b)return '';
  if(a&&b&&a!==b)return a+'-'+b+' חזרות';
  return (a||b)+' חזרות';
}
// Returns a clean {plan,log} or null when the shape is wrong.
function normalize(d){
  if(!d||!Array.isArray(d.plan)||d.plan.length!==4||!Array.isArray(d.log))return null;
  var out=blank();
  for(var i=0;i<4;i++){
    var w=d.plan[i];
    if(!w||!Array.isArray(w.exercises))return null;
    out.plan[i].exercises=w.exercises.map(cleanEx);
  }
  out.log=d.log.map(cleanLog);
  out.bodyLog=cleanBodyLog(d.bodyLog); // missing in older data/backups -> []
  return out;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r),n=normalize(d);
      if(n){
        var s=d.session;
        if(s&&typeof s.w==='number'&&s.w>=0&&s.w<4&&s.done&&typeof s.done==='object'){
          n.session={w:s.w,i:Math.max(0,s.i|0),done:s.done,tEnd:s.tEnd||null,tPause:s.tPause||null,tTotal:s.tTotal||0,start:s.start||Date.now()};
        }
        return n;
      }
    }
  }catch(e){storageOK=false;}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function fmtW(w){return String(Math.round(w*100)/100);}
function fmtDate(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+
    d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}
function fmtT(sec){
  sec=Math.max(0,Math.ceil(sec));
  var m=Math.floor(sec/60),s=sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function total(){return S.plan.reduce(function(a,w){return a+w.exercises.length;},0);}
function $(id){return document.getElementById(id);}

/* ---------- audio (iOS needs an unlock inside a user gesture) ---------- */
var actx=null;
function unlockAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state!=='running')actx.resume();
    var b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();
    src.buffer=b;src.connect(actx.destination);src.start(0);
  }catch(e){}
}
['touchend','pointerdown','click'].forEach(function(ev){document.addEventListener(ev,unlockAudio,{passive:true});});

function beeps(){
  try{
    if(!actx)unlockAudio();
    if(!actx)return;
    if(actx.state!=='running')actx.resume();
    var t=actx.currentTime+0.05;
    [880,880,1175].forEach(function(f,k){
      var o=actx.createOscillator(),g=actx.createGain(),st=t+k*0.32;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.6,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+0.24);
      o.connect(g);g.connect(actx.destination);
      o.start(st);o.stop(st+0.26);
    });
  }catch(e){}
}

/* ---------- wake lock ---------- */
var wl=null;
function wakeOn(){
  try{
    if(!('wakeLock' in navigator)||wl)return;
    navigator.wakeLock.request('screen').then(function(l){
      wl=l;l.addEventListener('release',function(){wl=null;});
    }).catch(function(){});
  }catch(e){}
}
function wakeOff(){
  try{if(wl){wl.release();wl=null;}}catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.session&&ui.screen==='workout')wakeOn();
});

/* ---------- ui state ---------- */
var ui={screen:'home',wi:0,editId:null,logIdx:-1,alarm:false,summary:null,pkind:'ex',pk:'',range:'h',bodyAll:false,bodyEdit:null};

function curWorkout(){return S.plan[S.session?S.session.w:ui.wi];}

/* ---------- views ---------- */
function viewHome(){
  var h='<h1>אימונים</h1>';
  if(!storageOK)h+='<div class="warnbox">אחסון הדפדפן לא זמין — הנתונים לא יישמרו.</div>';
  if(S.session){
    h+='<div class="card"><h2>אימון בתהליך</h2><p class="dim">'+esc(S.plan[S.session.w].name)+'</p>'+
      '<button class="pri big" data-act="resume">המשך אימון</button></div>';
  }
  if(total()===0){
    h+='<div class="card"><h2>התחלה</h2><p class="dim">התוכנית ריקה. הוסף תרגילים לאימונים.</p>'+
      '<button class="pri big" data-act="goplan">הוסף תרגיל</button></div>';
  }
  S.plan.forEach(function(w,i){
    h+='<div class="card"><div class="row between"><div class="grow"><h2>'+esc(w.name)+'</h2>'+
      '<div class="dim">'+w.exercises.length+' תרגילים</div></div>'+
      '<button class="play" aria-label="התחל '+esc(w.name)+'" data-act="start" data-i="'+i+'">'+ic('play','fill')+'</button></div></div>';
  });
  return h;
}

/* ---------- icons (inline, line style) ---------- */
var ICONS={
  play:'<path d="M8 5.5v13l11-6.5z"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  up:'<path d="M6 15l6-6 6 6"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  minus:'<path d="M5 12h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  log:'<path d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18M8 3v4M16 3v4"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/>',
  backup:'<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9a4.5 4.5 0 0 1 .5 9M12 11v8M9 16l3 3 3-3"/>'
};
function ic(n,c){return '<svg class="ico'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';}
// Rest-timer ring (display only): arc shows the share of the rest time still left.
var RING_R=54,RING_C=Math.round(2*Math.PI*RING_R*100)/100;
function ringOff(s){
  var left=s.tEnd?s.tEnd-Date.now():s.tPause||0,tot=(s.tTotal||0)*1000;
  var f=tot>0?Math.max(0,Math.min(1,left/tot)):0;
  return (RING_C*(1-f)).toFixed(2);
}

function viewWorkout(){
  var s=S.session,w=S.plan[s.w],n=w.exercises.length;
  if(!n)return '<p>אין תרגילים.</p>';
  var ex=w.exercises[s.i],done=s.done[ex.id]||0,complete=done>=ex.sets;
  var running=!!s.tEnd,paused=!!s.tPause;
  var h='<div class="row between"><div class="small dim">תרגיל '+(s.i+1)+' מתוך '+n+'</div>'+
    '<button class="bt-ico dng" data-act="exit" aria-label="יציאה">'+ic('close')+'</button></div>'+
    '<div class="prog"><i style="width:'+Math.round((s.i+1)/n*100)+'%"></i></div>'+
    '<div class="wname">'+esc(ex.name)+'</div>'+
    '<div class="wgt">'+fmtW(ex.weight)+' ק״ג'+(repsText(ex)?' <span class="reps">· '+repsText(ex)+'</span>':'')+'</div>'+
    '<div class="card"><div class="row between"><div class="setc">'+
      (complete?'הושלמו '+ex.sets+' מתוך '+ex.sets+' '+ic('check'):'סט '+(done+1)+' מתוך '+ex.sets)+'</div>'+
      '<div class="row"><button class="bt-ico" data-act="setdn" aria-label="הפחת סט">'+ic('minus')+'</button>'+
      '<button class="bt-ico" data-act="setup" aria-label="הוסף סט">'+ic('plus')+'</button></div></div></div>'+
    '<div class="card"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rt" cx="60" cy="60" r="'+RING_R+'"/>'+
      '<circle class="ra" id="rarc" cx="60" cy="60" r="'+RING_R+'" stroke-dasharray="'+RING_C+'" stroke-dashoffset="'+ringOff(s)+'"/></svg>'+
      '<div class="timer '+(running||paused?'run':'idle')+'" id="timer">'+
      fmtT(running?(s.tEnd-Date.now())/1000:paused?s.tPause/1000:ex.rest)+'</div></div>'+
      '<div class="small dim" style="text-align:center;margin-bottom:12px">מנוחה '+ex.rest+' שנ׳</div>';
  if(running||paused){
    h+='<div class="row"><button class="bt bt-sec grow" data-act="tpause">'+(paused?'המשך':'עצור')+'</button>'+
       '<button class="bt bt-sec grow" data-act="tskip">דלג על טיימר</button></div>';
  }
  h+='</div>'+
    '<button class="bt bt-pri pri" data-act="setdone" '+(complete?'disabled':'')+'>סיימתי סט</button>'+
    '<button class="bt bt-main '+(complete?'pri':'')+'" data-act="next" style="width:100%;margin-top:12px">'+
      (s.i===n-1?'סיים אימון':'הבא')+'</button>'+
    '<div class="row" style="margin-top:32px"><button class="bt bt-sec grow" data-act="prev" '+(s.i===0?'disabled':'')+'>הקודם</button>'+
      '<button class="bt bt-sec grow" data-act="skipex">דלג על תרגיל</button>'+
      '<button class="bt bt-sec grow" data-act="finish">סיום אימון</button></div>';
  return h;
}

function viewSummary(){
  var sm=ui.summary,h='<h1>סיכום אימון</h1><p class="dim">'+esc(sm.workout)+'</p>';
  if(!sm.items.length){
    h+='<div class="card"><p>לא בוצעו תרגילים באימון הזה.</p></div>'+
      '<button class="big" data-act="discard">חזרה</button>';
    return h;
  }
  sm.items.forEach(function(it,i){
    h+='<div class="card"><h2>'+esc(it.name)+'</h2>'+(repsText(it)?'<div class="dim small" style="margin-bottom:8px">יעד: '+repsText(it)+'</div>':'')+'<div class="row">'+
      '<div class="field"><label>משקל (ק״ג)</label><input id="sw'+i+'" inputmode="decimal" value="'+fmtW(it.weight)+'"></div>'+
      '<div class="field"><label>סטים</label><input id="ss'+i+'" inputmode="numeric" value="'+it.sets+'"></div></div></div>';
  });
  h+='<label class="chk"><input type="checkbox" id="upd" checked> עדכן את משקל העבודה בתוכנית</label>'+
    '<button class="pri big" data-act="savew" style="margin-top:8px">שמור אימון</button>'+
    '<button class="big" data-act="back2w" style="margin-top:12px">חזרה לאימון</button>';
  return h;
}

function viewLog(){
  var h='<h1>יומן</h1>';
  if(!S.log.length)return h+'<div class="card dim">עדיין אין אימונים ביומן.</div>';
  var idx=S.log.map(function(_,i){return i;}).sort(function(a,b){return S.log[b].ts-S.log[a].ts;});
  idx.forEach(function(i){

/* ---------- progress ---------- */
var MONTHS=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
var RANGES=[['m','חודש',30],['q','3 חודשים',91],['h','חצי שנה',182],['y','שנה',365],['a','הכל',0]];
var DAY=864e5;

function exKey(n){return String(n).trim();}
// Names that have at least one log record, most recently used first.
function exerciseNames(){
  var last=new Map();
  S.log.forEach(function(r){r.items.forEach(function(it){
    var k=exKey(it.name);
    if(k&&(!last.has(k)||r.ts>last.get(k)))last.set(k,r.ts);
  });});
  return Array.from(last.keys()).sort(function(a,b){return last.get(b)-last.get(a);});
}
// Only records whose weight differs from the previous record of the same exercise.
// The first record counts as the initial update.
function exerciseUpdates(name){
  var pts=[];
  S.log.forEach(function(r){r.items.forEach(function(it){
    if(exKey(it.name)===name)pts.push({ts:r.ts,v:it.weight});
  });});
  pts.sort(function(a,b){return a.ts-b.ts;});
  var out=[],prev=null;
  pts.forEach(function(p){if(prev===null||p.v!==prev)out.push(p);prev=p.v;});
  return out;
}
function lastWeight(name){
  var best=null;
  S.log.forEach(function(r){r.items.forEach(function(it){
    if(exKey(it.name)===name&&(!best||r.ts>=best.ts))best={ts:r.ts,v:it.weight};
  });});
  return best;
}
function fmtDay(ts){
  return new Date(ts).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
}
function fmtDelta(d){
  d=Math.round(d*100)/100;
  return (d>0?'+':d<0?'-':'')+fmtW(Math.abs(d));
}
function ymd(ts){
  var d=new Date(ts),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

// pts: [{ts,v}] ascending. Hand-written SVG, real time axis, always LTR (old -> new).
function chartSvg(pts){
  var W=360,H=230,L=46,R=14,T=16,B=40,pw=W-L-R,ph=H-T-B;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף התקדמות">';
  var txt=function(x,y,t,a,c){return '<text x="'+x+'" y="'+y+'" text-anchor="'+a+'" fill="'+(c||'#8E8E96')+'" font-size="12">'+t+'</text>';};
  if(pts.length<2){
    var v=pts[0].v;
    s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#26262B"/>'+
      '<circle cx="'+(L+pw/2)+'" cy="'+(T+ph/2)+'" r="6" fill="#FF7A1A"/>'+
      txt(L+pw/2,T+ph/2-14,fmtW(v),'middle','#F2F2F4');
    return s+'</svg>';
  }
  var rg=RANGES.filter(function(r){return r[0]===ui.range;})[0]||RANGES[2];
  var end=Math.max(Date.now(),pts[pts.length-1].ts);
  var start=rg[2]?end-rg[2]*DAY:pts[0].ts;
  if(end<=start)end=start+DAY;
  var anchor=null,inside=[];
  pts.forEach(function(p){if(p.ts<start)anchor=p;else inside.push(p);});
  var ser=[];
  if(anchor)ser.push({ts:start,v:anchor.v,dot:false});
  inside.forEach(function(p){ser.push({ts:p.ts,v:p.v,dot:true});});
  if(ser.length===1&&anchor)ser.push({ts:end,v:anchor.v,dot:false}); // flat line, no update in range
  var vals=ser.map(function(p){return p.v;}),dmin=Math.min.apply(null,vals),dmax=Math.max.apply(null,vals);
  var mn=dmin,mx=dmax;
  if(mn===mx){mn-=1;mx+=1;}else{var pad=(mx-mn)*0.15;mn-=pad;mx+=pad;}
  var X=function(ts){return L+(ts-start)/(end-start)*pw;};
  var Y=function(v){return T+(1-(v-mn)/(mx-mn))*ph;};
  // month grid
  var months=(end-start)/(30.4*DAY),step=Math.max(1,Math.ceil(months/6)),lineStep=months<=12?1:step;
  var d=new Date(start),cur=new Date(d.getFullYear(),d.getMonth()+1,1),i=0;
  var crossYear=new Date(start).getFullYear()!==new Date(end).getFullYear();
  var yearAt=[];
  while(cur.getTime()<=end){
    var x=X(cur.getTime()),m=cur.getMonth();
    if(i%lineStep===0)s+='<line x1="'+x.toFixed(1)+'" y1="'+T+'" x2="'+x.toFixed(1)+'" y2="'+(T+ph)+'" stroke="#26262B"/>';
    if(i%step===0){
      s+=txt(x.toFixed(1),T+ph+16,MONTHS[m],'middle');
      if(crossYear&&m===0){s+=txt(x.toFixed(1),T+ph+31,cur.getFullYear(),'middle','#F2F2F4');yearAt.push(x);}
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);i++;
  }
  if(crossYear&&!yearAt.some(function(x){return x<L+44;})){
    s+=txt(L,T+ph+31,new Date(start).getFullYear(),'start','#F2F2F4');
  }
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="#3A3A42"/>';
  s+=txt(L-6,Y(dmax)+4,fmtW(dmax),'end');
  if(dmin!==dmax)s+=txt(L-6,Y(dmin)+4,fmtW(dmin),'end');
  s+='<polyline fill="none" stroke="#FF7A1A" stroke-width="2" stroke-linejoin="round" points="'+
    ser.map(function(p){return X(p.ts).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ')+'"/>';
  ser.forEach(function(p){
    if(p.dot)s+='<circle cx="'+X(p.ts).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="#FF7A1A" stroke="#0D0D0F" stroke-width="1.5"/>';
  });
  return s+'</svg>';
}
function rangeBar(){
  return '<div class="rng">'+RANGES.map(function(r){
    return '<button data-act="range" data-r="'+r[0]+'" class="'+(r[0]===ui.range?'on':'')+'">'+r[1]+'</button>';
  }).join('')+'</div>';
}
function chartBlock(pts){
  if(!pts.length)return '<div class="card dim">אין עדיין נתונים.</div>';
  if(pts.length<2)return '<div class="card">'+chartSvg(pts)+'<p class="dim" style="text-align:center;margin:8px 0 0">אין עדיין מספיק נתונים לגרף</p></div>';
  return rangeBar()+'<div class="card">'+chartSvg(pts)+'</div>';
}

    }

  }
  var ups=exerciseUpdates(ui.pk);
  h+=chartBlock(ups);
  if(ups.length){

      var dl=i===0?'התחלה':fmtDelta(ups[i].v-ups[i-1].v);
      h+='<div class="trow"><div class="c1">'+esc(fmtDay(ups[i].ts))+'</div><div class="c2">'+fmtW(ups[i].v)+'</div>'+
        '<div class="c3 '+(dl[0]==='+'?'up':dl[0]==='-'?'dn':'')+'">'+dl+'</div></div>';

/* ---------- render ---------- */
function render(keep){
  var sc=ui.screen,app=$('app'),nav=$('nav'),h;
  var focus=sc==='workout'||sc==='summary';
  if(sc==='home')h=viewHome();
  else if(sc==='workout')h=viewWorkout();
  else if(sc==='summary')h=viewSummary();
  else if(sc==='log')h=viewLog();
  else if(sc==='logd')h=viewLogDetail();
  else if(sc==='prog')h=viewProg();
  else if(sc==='progd')h=viewProgDetail();
  else if(sc==='plan')h=viewPlan();
  else if(sc==='edit')h=viewEdit();
  else h=viewBackup();
  app.innerHTML=h;
  app.className=focus?'noNav':'';
  nav.style.display=focus?'none':'flex';
  var tab={home:'home',log:'log',logd:'log',prog:'prog',progd:'prog',plan:'plan',edit:'plan',backup:'backup'}[sc];
  var tabs=[['home','אימון','dumbbell'],['log','יומן','log'],['prog','התקדמות','trend'],['plan','תוכנית','list'],['backup','גיבוי','backup']];
  nav.innerHTML=tabs.map(function(t){
    return '<button data-act="nav" data-s="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+ic(t[2])+'<span>'+t[1]+'</span></button>';
  }).join('');
  $('ov').innerHTML=ui.alarm?'<div class="ov"><div>המנוחה נגמרה!</div><button data-act="alarmoff">המשך</button></div>':'';
  if(keep!==true)window.scrollTo(0,0);
}

/* ---------- timer ---------- */
function startTimer(sec){
  var s=S.session;
  s.tEnd=Date.now()+sec*1000;s.tPause=null;s.tTotal=sec;
}
function stopTimer(){
  var s=S.session;
  if(s){s.tEnd=null;s.tPause=null;}
}
setInterval(function(){
  var s=S.session;
  if(!s||ui.screen!=='workout'||!s.tEnd)return;
  var left=s.tEnd-Date.now();
  if(left<=0){
    s.tEnd=null;save();
    ui.alarm=true;beeps();render();
  }else{
    var t=$('timer');if(t)t.textContent=fmtT(left/1000);
    var a=$('rarc');if(a)a.setAttribute('stroke-dashoffset',ringOff(s));
  }
},250);

/* ---------- session ---------- */
function goWorkout(){
  ui.screen='workout';wakeOn();render();
}
function buildSummary(){
  var s=S.session,w=S.plan[s.w],items=[];
  w.exercises.forEach(function(e){
    var d=s.done[e.id]||0;
    if(d>0)items.push({id:e.id,name:e.name,weight:e.weight,sets:d,repMin:e.repMin,repMax:e.repMax});
  });
  ui.summary={workout:w.name,items:items,start:s.start};
}
function endSession(){
  stopTimer();ui.alarm=false;wakeOff();
  buildSummary();ui.screen='summary';save();render();
}
function leaveSession(){
  S.session=null;ui.summary=null;ui.alarm=false;wakeOff();save();
  ui.screen='home';render();
}
function gotoEx(i){
  var s=S.session,n=S.plan[s.w].exercises.length;
  stopTimer();ui.alarm=false;
  if(i>=n){endSession();return;}
  s.i=Math.max(0,i);save();render();
}

/* ---------- actions ---------- */
var A={
  nav:function(el){
    ui.screen=el.dataset.s;ui.editId=null;render();
  },
  goplan:function(){ui.screen='plan';ui.editId=null;render();},
  start:function(el){
    var i=+el.dataset.i;
    if(!S.plan[i].exercises.length){ui.wi=i;ui.screen='edit';render();return;}
    if(S.session&&!confirm('יש אימון בתהליך. להתחיל אימון חדש ולבטל אותו?'))return;
    S.session={w:i,i:0,done:{},tEnd:null,tPause:null,tTotal:0,start:Date.now()};
    save();goWorkout();
  },
  resume:function(){goWorkout();},
  setdone:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i],d=s.done[ex.id]||0;
    if(d>=ex.sets)return;
    s.done[ex.id]=d+1;
    if(ex.rest>0)startTimer(ex.rest);
    save();render();
  },
  setup:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    s.done[ex.id]=Math.min(ex.sets,(s.done[ex.id]||0)+1);save();render();
  },
  setdn:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    s.done[ex.id]=Math.max(0,(s.done[ex.id]||0)-1);save();render();
  },
  tpause:function(){
    var s=S.session;
    if(s.tEnd){s.tPause=Math.max(0,s.tEnd-Date.now());s.tEnd=null;}
    else if(s.tPause!=null){s.tEnd=Date.now()+s.tPause;s.tPause=null;}
    save();render();
  },
  tskip:function(){stopTimer();save();render();},
  alarmoff:function(){ui.alarm=false;render();},
  next:function(){gotoEx(S.session.i+1);},
  prev:function(){gotoEx(S.session.i-1);},
  skipex:function(){
    var s=S.session,ex=S.plan[s.w].exercises[s.i];
    delete s.done[ex.id];gotoEx(s.i+1);
  },
  finish:function(){if(confirm('לסיים את האימון ולעבור לסיכום?'))endSession();},
  exit:function(){if(confirm('לצאת מהאימון בלי לשמור?'))leaveSession();},
  discard:function(){leaveSession();},
  back2w:function(){goWorkout();},
  savew:function(){
    var sm=ui.summary,upd=$('upd').checked,s=S.session,items=[];
    sm.items.forEach(function(it,i){
      var w=Math.max(0,num($('sw'+i).value,it.weight)),n=Math.max(0,Math.round(num($('ss'+i).value,it.sets)));
      if(n>0)items.push({name:it.name,weight:w,sets:n,id:it.id,repMin:it.repMin,repMax:it.repMax});
    });
    if(!items.length){alert('אין תרגילים לשמירה.');return;}
    if(upd){
      var pl=S.plan[s.w];
      items.forEach(function(it){
        pl.exercises.forEach(function(e){if(e.id===it.id)e.weight=it.weight;});
      });
    }
    S.log.push({ts:Date.now(),workout:sm.workout,items:items.map(function(it){return {name:it.name,weight:it.weight,sets:it.sets,repMin:it.repMin||null,repMax:it.repMax||null};})});
    leaveSession();
  },
  logopen:function(el){ui.logIdx=+el.dataset.i;ui.screen='logd';render();},
  logback:function(){ui.screen='log';render();},
  logsave:function(){
    var r=S.log[ui.logIdx];
    r.items.forEach(function(it,i){
      it.weight=Math.max(0,num($('lw'+i).value,it.weight));
      it.sets=Math.max(0,Math.round(num($('ls'+i).value,it.sets)));
    });
    save();ui.screen='log';render();
  },
  logdel:function(){
    if(!confirm('למחוק את הרשומה מהיומן?'))return;
    S.log.splice(ui.logIdx,1);save();ui.screen='log';render();
  },
  editw:function(el){ui.wi=+el.dataset.i;ui.editId=null;ui.screen='edit';render();},
  saveex:function(){
    var name=$('fn').value.trim();
    if(!name){$('fn').focus();return;}
    var rmin=cleanRep($('fmin').value),rmax=cleanRep($('fmax').value),err=$('ferr');
    if(rmin&&rmax&&rmin>rmax){
      err.textContent='חזרות מינימום לא יכולות להיות גדולות מהמקסימום.';err.hidden=false;
      $('fmin').focus();return;
    }
    var w=S.plan[ui.wi],data=cleanEx({id:ui.editId||uid(),name:name,weight:$('fw').value,sets:$('fs').value,rest:$('fr').value,repMin:rmin,repMax:rmax});
    if(ui.editId){
      w.exercises=w.exercises.map(function(e){return e.id===ui.editId?data:e;});
    }else w.exercises.push(data);
    ui.editId=null;save();render();
  },
  exedit:function(el){ui.editId=el.dataset.id;render();},
  canceledit:function(){ui.editId=null;render();},
  exdel:function(el){
    if(!confirm('למחוק את התרגיל?'))return;
    var w=S.plan[ui.wi];
    w.exercises=w.exercises.filter(function(e){return e.id!==el.dataset.id;});
    if(ui.editId===el.dataset.id)ui.editId=null;
    save();render();
  },
  exup:function(el){moveEx(el.dataset.id,-1);},
  exdn:function(el){moveEx(el.dataset.id,1);},
  progbody:function(){ui.pkind='body';ui.bodyEdit=null;ui.bodyAll=false;ui.screen='progd';render();},
  progex:function(el){ui.pkind='ex';ui.pk=el.dataset.k;ui.screen='progd';render();},
  progback:function(){ui.screen='prog';render();},
  range:function(el){ui.range=el.dataset.r;render(true);},
  bodyall:function(){ui.bodyAll=!ui.bodyAll;render(true);},
  bodyedit:function(el){ui.bodyEdit=+el.dataset.i;render();},
  bodycancel:function(){ui.bodyEdit=null;render(true);},
  bodydel:function(el){
    if(!confirm('למחוק את השקילה?'))return;
    S.bodyLog.splice(+el.dataset.i,1);ui.bodyEdit=null;save();render(true);
  },
  bodysave:function(){
    var err=$('berr'),kg=num($('bw').value,0),v=$('bd').value,m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    var fail=function(t){err.textContent=t;err.hidden=false;};
    if(!(kg>0)||kg>500)return fail('יש להזין משקל גדול מאפס.');
    if(!m)return fail('יש לבחור תאריך.');
    if(v>ymd(Date.now()))return fail('לא ניתן לבחור תאריך עתידי.');
    var old=ui.bodyEdit!=null?S.bodyLog[ui.bodyEdit]:null,ts;
    if(old&&ymd(old.ts)===v)ts=old.ts;
    else if(v===ymd(Date.now()))ts=Date.now();
    else ts=new Date(+m[1],+m[2]-1,+m[3],12).getTime();
    var rec={ts:ts,kg:Math.round(kg*100)/100};
    if(old)S.bodyLog.splice(ui.bodyEdit,1);
    S.bodyLog.push(rec);
    S.bodyLog.sort(function(a,b){return a.ts-b.ts;});
    ui.bodyEdit=null;save();render(true);
  },
  export:function(){doExport();},
  import:function(){$('file').click();}
};
function moveEx(id,d){
  var a=S.plan[ui.wi].exercises,i=a.findIndex(function(e){return e.id===id;}),j=i+d;
  if(i<0||j<0||j>=a.length)return;
  var t=a[i];a[i]=a[j];a[j]=t;save();render();
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var f=A[el.dataset.act];
  if(f)f(el);
});

/* ---------- backup ---------- */
function doExport(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  var name='workout-backup-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
  var text=JSON.stringify({app:'workout-app',version:1,exported:d.toISOString(),plan:S.plan,log:S.log,bodyLog:S.bodyLog},null,2);
  try{
    var file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(function(){});
      return;
    }
  }catch(e){}
  try{
    var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }catch(e){alert('הייצוא נכשל.');}
}
document.addEventListener('change',function(ev){
  if(ev.target.id!=='file')return;
  var f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var n=null;
    try{n=normalize(JSON.parse(rd.result));}catch(e){}
    if(!n){alert('קובץ הגיבוי לא תקין.');return;}
    if(!confirm('להחליף את התוכנית והיומן הנוכחיים ('+n.log.length+' אימונים ביומן)?'))return;
    S.plan=n.plan;S.log=n.log;S.bodyLog=n.bodyLog;S.session=null;save();
    ui.screen='home';render();
  };
  rd.onerror=function(){alert('קריאת הקובץ נכשלה.');};
  rd.readAsText(f);
});

/* ---------- boot ---------- */
S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(S.session)ui.screen='workout';
else if(total()===0){ui.screen='edit';ui.wi=0;}
if(ui.screen==='workout'){
  var s0=S.session,n0=S.plan[s0.w].exercises.length;
  if(!n0||s0.i>=n0){S.session=null;ui.screen='home';}
  else{
    wakeOn();
    if(s0.tEnd&&s0.tEnd<=Date.now()){s0.tEnd=null;ui.alarm=true;}
  }
}
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
</body>
